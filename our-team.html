<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Team — THE MIRROR JAMMU KASHMIR</title>
<link rel="stylesheet" href="styles.css?v=26">
<style>
/* TEAM PAGE LAYOUT */
.team-shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px;
}

.team-title {
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
}

.team-subtitle {
    text-align: center;
    font-size: 1rem;
    color: #555;
    margin-bottom: 40px;
}

/* GRID */
.team-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
}

@media(max-width: 900px) {
    .team-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {
    .team-grid {
        grid-template-columns: 1fr;
    }
}

/* TEAM CARD */
.team-card {
    background: #ffffff;
    border: 1px solid #ddd;
    padding: 18px;
    text-align: center;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.team-card img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 12px;
}

.team-name {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #111;
    line-height: 1.3;
}

.team-role {
    font-size: 0.9rem;
    font-weight: 600;
    color: #800000;
    margin-bottom: 12px;
}

.team-contact {
    font-size: 0.85rem;
    color: #444;
    line-height: 1.5;
    margin-top: auto;
}

.team-contact a {
    color: #800000;
    text-decoration: none;
}

.team-contact a:hover {
    text-decoration: underline;
}

.loading-msg {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.1rem;
    color: #666;
    padding: 40px 0;
}
</style>
</head>

<body class="theme-maroon">

<main class="team-shell">

    <h1 class="team-title" id="page-title">Our Team</h1>
    <p class="team-subtitle" id="page-subtitle">
        Meet the dedicated journalists, editors, experts, media persons, designers, and human rights advocates behind THE MIRROR JAMMU KASHMIR.
    </p>

    <div class="team-grid" id="team-container">
        <div class="loading-msg">Loading team profiles...</div>
    </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // 1. Embedded JSON Fallback
    const fallbackData = {
      "team": [
        {
          "name": "Sardar Shaukat Ali Kashmiri",
          "designation": "Senior Human Rights & Geopolitical Analyst",
          "email": "sg.jkipa@gmail.com",
          "image": "content/images/sardar-shaukat-ali-kashmiri.jpg"
        },
        {
          "name": "Dr Joseph Ayeah Chongsi",
          "designation": "Senior Human Rights & Legal Expert",
          "email": "someone@example.com",
          "image": "content/images/dr-joseph-ayeah-chongsi.jpg"
        },
        {
          "name": "Contributing Columnists & Analysts",
          "designation": "Guest Columnists & Opinion Writers",
          "email": "editor@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Jammu, Kashmir & Ladakh",
          "designation": "Regional Bureau Lead",
          "email": "jk.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Azad Kashmir",
          "designation": "Regional Bureau Lead",
          "email": "ajk.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Gilgit Baltistan",
          "designation": "Regional Bureau Lead",
          "email": "gb.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — United Kingdom",
          "designation": "UK Bureau Lead",
          "email": "uk.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Europe",
          "designation": "European Affairs Bureau",
          "email": "eu.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — United States",
          "designation": "US Bureau Lead",
          "email": "us.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Canada",
          "designation": "Canada Bureau Lead",
          "email": "ca.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Volunteer Research & Reporting Network",
          "designation": "Grassroots Correspondents & Community Researchers",
          "email": "volunteers@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Digital Media & Advocacy Volunteers",
          "designation": "Digital Content & Media Contributors",
          "email": "media.volunteer@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        }
      ]
    };

    function renderTeamCards(data) {
        const teamContainer = document.getElementById('team-container');
        teamContainer.innerHTML = '';

        const teamArray = data.team || [];
        teamArray.forEach(member => {
            const card = document.createElement('div');
            card.className = 'team-card';

            const imageSrc = member.image || 'images/team-placeholder.jpg';
            const name = member.name || 'Team Member';
            const role = member.designation || 'Contributor';
            const email = member.email || '';

            card.innerHTML = `
                <img src="${imageSrc}" alt="${name}" onerror="this.onerror=null; this.src='images/team-placeholder.jpg';">
                <div class="team-name">${name}</div>
                <div class="team-role">${role}</div>
                <div class="team-contact">
                    ${email ? `Email: <a href="mailto:${email}">${email}</a>` : ''}
                </div>
            `;
            teamContainer.appendChild(card);
        });
    }

    // 2. Fetch content/our-team.json; if failed or offline, fall back instantly to embedded data
    fetch('content/our-team.json')
        .then(response => {
            if (!response.ok) throw new Error("File path error");
            return response.json();
        })
        .then(data => renderTeamCards(data))
        .catch(err => {
            console.warn("Fetching content/our-team.json failed, loading fallback data:", err);
            renderTeamCards(fallbackData);
        });
});
</script>

</body>
</html>
