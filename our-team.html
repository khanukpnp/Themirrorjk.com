<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Team — THE MIRROR JAMMU KASHMIR</title>
<link rel="stylesheet" href="styles.css?v=26">
<style>
/* TEAM PAGE LAYOUT */
.team-shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px;
}

.team-title {
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
}

.team-subtitle {
    text-align: center;
    font-size: 1rem;
    color: #555;
    margin-bottom: 40px;
}

/* GRID */
.team-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
}

@media(max-width: 900px) {
    .team-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 600px) {
    .team-grid {
        grid-template-columns: 1fr;
    }
}

/* TEAM CARD */
.team-card {
    background: #ffffff;
    border: 1px solid #ddd;
    padding: 18px;
    text-align: center;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.team-card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 12px;
}

.team-name {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: #111;
    line-height: 1.3;
}

.team-role {
    font-size: 0.9rem;
    font-weight: 600;
    color: #800000;
    margin-bottom: 12px;
}

.team-contact {
    font-size: 0.85rem;
    color: #444;
    line-height: 1.5;
    margin-top: auto;
}

.team-contact a {
    color: #800000;
    text-decoration: none;
}

.team-contact a:hover {
    text-decoration: underline;
}

.loading-msg {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.1rem;
    color: #666;
    padding: 40px 0;
}
</style>
</head>

<body class="theme-maroon">

<main class="team-shell">

    <h1 class="team-title" id="page-title">Our Team</h1>
    <p class="team-subtitle" id="page-subtitle">
        Meet the dedicated journalists, editors, designers, and human rights advocates behind THE MIRROR JAMMU KASHMIR.
    </p>

    <div class="team-grid" id="team-container">
        <!-- Dynamic content will load here from JSON -->
        <div class="loading-msg">Loading team profiles...</div>
    </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // Path to your JSON file (adjust relative path if stored in content/ or data/)
    const jsonPath = 'our-team.json';

    fetch(jsonPath)
        .then(response => {
            if (!response.ok) {
                throw new Error("HTTP error! Status: " + response.status);
            }
            return response.json();
        })
        .then(data => {
            const teamContainer = document.getElementById('team-container');
            
            // Clear loading placeholder
            teamContainer.innerHTML = '';

            // Update page headers dynamically if available in JSON
            if (data.title) {
                document.getElementById('page-title').innerText = data.title;
            }

            const teamArray = data.team || [];

            if (teamArray.length === 0) {
                teamContainer.innerHTML = '<div class="loading-msg">No profiles found.</div>';
                return;
            }

            // Loop through JSON profiles and construct team cards
            teamArray.forEach(member => {
                const card = document.createElement('div');
                card.className = 'team-card';

                const imageSrc = member.image ? member.image : 'images/team-placeholder.jpg';
                const name = member.name || 'Team Member';
                const role = member.designation || 'Contributor';
                const email = member.email || '';
                const phone = member.phone || '';

                card.innerHTML = `
                    <img src="${imageSrc}" alt="${name}" onerror="this.onerror=null; this.src='images/team-placeholder.jpg';">
                    <div class="team-name">${name}</div>
                    <div class="team-role">${role}</div>
                    <div class="team-contact">
                        ${email ? `Email: <a href="mailto:${email}">${email}</a><br>` : ''}
                        ${phone && phone !== '+00 000 000 0000' ? `Phone: ${phone}` : ''}
                    </div>
                `;

                teamContainer.appendChild(card);
            });
        })
        .catch(error => {
            console.error('Error fetching team JSON:', error);
            document.getElementById('team-container').innerHTML = `
                <div class="loading-msg" style="color:#800000;">
                    Unable to load profiles. Please check if <strong>our-team.json</strong> exists in your website directory.
                </div>
            `;
        });
});
</script>

</body>
</html>
