<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Team & Editorial Board — THE MIRROR JAMMU KASHMIR</title>

<!-- GOOGLE FONTS & FONT AWESOME ICONS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="stylesheet" href="styles.css?v=26">

<style>
/* MODERN TEAM PAGE STYLES */
body {
    font-family: 'Inter', sans-serif;
    background-color: #f8f9fa;
    color: #222;
    margin: 0;
    padding: 0;
}

.team-shell {
    max-width: 1200px;
    margin: 0 auto;
    padding: 50px 20px 80px 20px;
}

.team-header {
    text-align: center;
    margin-bottom: 50px;
}

.team-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 2.8rem;
    font-weight: 700;
    color: #800000;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
}

.team-subtitle {
    font-size: 1.05rem;
    color: #555;
    max-width: 750px;
    margin: 0 auto;
    line-height: 1.6;
}

/* TEAM GRID */
.team-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
}

@media(max-width: 992px) {
    .team-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width: 650px) {
    .team-grid {
        grid-template-columns: 1fr;
    }
}

/* MODERN PLACE-CARD DESIGN */
.team-card {
    background: #ffffff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    border: 1px solid #eef0f2;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    position: relative;
}

.team-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 12px 25px rgba(128, 0, 0, 0.12);
    border-color: #f0d5d5;
}

.card-top-accent {
    height: 6px;
    background: linear-gradient(90deg, #800000, #b30000, #d9534f);
}

.team-card-img-wrapper {
    position: relative;
    width: 100%;
    height: 280px;
    background-color: #f0f0f0;
    overflow: hidden;
}

.team-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    transition: transform 0.4s ease;
}

.team-card:hover img {
    transform: scale(1.04);
}

.team-card-body {
    padding: 22px 20px 24px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.team-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.25rem;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
    line-height: 1.3;
}

.team-role {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    color: #800000;
    background: #fdf2f2;
    padding: 5px 12px;
    border-radius: 20px;
    margin: 0 auto 16px auto;
    letter-spacing: 0.2px;
    border: 1px solid #fae1e1;
}

.team-contact {
    font-size: 0.85rem;
    color: #666;
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px dashed #eee;
}

.team-contact a {
    color: #800000;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
}

.team-contact a:hover {
    color: #b30000;
    text-decoration: underline;
}

.team-contact i {
    margin-right: 6px;
    color: #800000;
}

/* BOTTOM NAVIGATION BUTTONS */
.bottom-nav-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin-top: 60px;
    padding-top: 30px;
    border-top: 1px solid #e5e5e5;
}

.nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    background-color: #ffffff;
    color: #800000;
    border: 1.5px solid #800000;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.25s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}

.nav-btn:hover {
    background-color: #800000;
    color: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(128, 0, 0, 0.2);
}

.nav-btn.home-btn {
    background-color: #800000;
    color: #ffffff;
}

.nav-btn.home-btn:hover {
    background-color: #600000;
    border-color: #600000;
}

.loading-msg {
    grid-column: 1 / -1;
    text-align: center;
    font-size: 1.1rem;
    color: #666;
    padding: 50px 0;
}
</style>
</head>

<body>

<main class="team-shell">

    <div class="team-header">
        <h1 class="team-title" id="page-title">Our Team</h1>
        <p class="team-subtitle" id="page-subtitle">
            Meet the dedicated journalists, editors, experts, designers, and human rights advocates behind THE MIRROR JAMMU KASHMIR.
        </p>
    </div>

    <!-- CARDS CONTAINER -->
    <div class="team-grid" id="team-container">
        <div class="loading-msg">Loading team profiles...</div>
    </div>

    <!-- BOTTOM NAVIGATION BUTTONS -->
    <div class="bottom-nav-container">
        <a href="javascript:history.back()" class="nav-btn">
            <i class="fa-solid fa-arrow-left"></i> Previous
        </a>
        <a href="index.html" class="nav-btn home-btn">
            <i class="fa-solid fa-house"></i> Home
        </a>
        <a href="about.html" class="nav-btn">
            Next <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", function () {
    // Embedded JSON Fallback
    const fallbackData = {
      "team": [
        {
          "name": "Sardar Shaukat Ali Kashmiri",
          "designation": "Senior Human Rights & Geopolitical Analyst",
          "email": "sg.jkipa@gmail.com",
          "image": "content/images/sardar-shaukat-ali-kashmiri.jpg"
        },
        {
          "name": "Dr Joseph Ayeah Chongsi",
          "designation": "Senior Human Rights & Legal Expert",
          "email": "someone@example.com",
          "image": "content/images/dr-joseph-ayeah-chongsi.jpg"
        },
        {
          "name": "Contributing Columnists & Analysts",
          "designation": "Guest Columnists & Opinion Writers",
          "email": "editor@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Jammu, Kashmir & Ladakh",
          "designation": "Regional Bureau Lead",
          "email": "jk.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Azad Kashmir",
          "designation": "Regional Bureau Lead",
          "email": "ajk.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Gilgit Baltistan",
          "designation": "Regional Bureau Lead",
          "email": "gb.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — United Kingdom",
          "designation": "UK Bureau Lead",
          "email": "uk.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Europe",
          "designation": "European Affairs Bureau",
          "email": "eu.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — United States",
          "designation": "US Bureau Lead",
          "email": "us.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        },
        {
          "name": "Special Correspondent — Canada",
          "designation": "Canada Bureau Lead",
          "email": "ca.bureau@themirrorjk.com",
          "image": "images/team-placeholder.jpg"
        }
      ]
    };

    function renderTeamCards(data) {
        const teamContainer = document.getElementById('team-container');
        teamContainer.innerHTML = '';

        const teamArray = data.team || [];
        teamArray.forEach(member => {
            const card = document.createElement('div');
            card.className = 'team-card';

            const imageSrc = member.image || 'images/team-placeholder.jpg';
            const name = member.name || 'Team Member';
            const role = member.designation || 'Contributor';
            const email = member.email || '';

            card.innerHTML = `
                <div class="card-top-accent"></div>
                <div class="team-card-img-wrapper">
                    <img src="${imageSrc}" alt="${name}" onerror="this.onerror=null; this.src='images/team-placeholder.jpg';">
                </div>
                <div class="team-card-body">
                    <div class="team-name">${name}</div>
                    <div class="team-role">${role}</div>
                    <div class="team-contact">
                        ${email ? `<i class="fa-regular fa-envelope"></i> <a href="mailto:${email}">${email}</a>` : ''}
                    </div>
                </div>
            `;
            teamContainer.appendChild(card);
        });
    }

    // Attempt to load JSON from content folder, fallback to embedded array if missing
    fetch('content/our-team.json')
        .then(response => {
            if (!response.ok) throw new Error("Path error");
            return response.json();
        })
        .then(data => renderTeamCards(data))
        .catch(err => {
            console.warn("JSON fetch failed, using fallback team array:", err);
            renderTeamCards(fallbackData);
        });
});
</script>

</body>
</html>
