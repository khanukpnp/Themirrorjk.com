<article class="article-container">

<h1 id="article-title">Loading…</h1>

<p class="article-meta" id="article-meta"></p>

<!-- HERO IMAGE -->
<figure id="article-hero" class="article-hero"></figure>

<!-- MAIN CONTENT -->
<div id="article-body"></div>

</article>

<script>
async function loadArticle() {
  try {
    const res = await fetch("content/latest/latest-001.json", { cache: "no-store" });
    const data = await res.json();

    // TITLE
    document.getElementById("article-title").textContent = data.title;

    // META
    document.getElementById("article-meta").innerHTML =
      `<span>${data.author}</span> | <span>${data.date}</span> | <span>${data.location}</span>`;

    // HERO IMAGE
    const hero = document.getElementById("article-hero");
    hero.innerHTML = `
      <img src="${data.heroImage.src}" alt="${data.heroImage.caption}">
      <figcaption>${data.heroImage.caption} — ${data.heroImage.credit}</figcaption>
    `;

    // BODY
    const body = document.getElementById("article-body");
    body.innerHTML = "";

    // FIRST PARAGRAPH WITH INLINE IMAGE
    const first = data.body[0].text;
    const inline = data.inlineImage;

    body.innerHTML += `
      <p>
        <figure class="float-right" style="width:${inline.width}">
          <img src="${inline.src}" alt="${inline.caption}">
          <figcaption>${inline.caption}</figcaption>
        </figure>
        ${first}
      </p>
    `;

    // REMAINING PARAGRAPHS
    data.body.slice(1).forEach(block => {
      body.innerHTML += `<p>${block.text}</p>`;
    });

  } catch (err) {
    console.error("Failed to load article", err);
  }
}

loadArticle();
</script>
