<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>The Mirror Jammu Kashmir</title>

<link rel="stylesheet" href="../../styles.css">

</head>

<body class="article-page">

<main class="article-shell">

<header class="article-header">

<h1 id="article-title"></h1>

<div class="article-meta">

<span id="article-author"></span>

<span id="article-location"></span>

<span id="article-date"></span>

<span id="article-read"></span>

</div>

</header>



<figure class="article-hero">

<img id="hero-image" src="" alt="">

<figcaption id="hero-caption"></figcaption>

</figure>



<section class="article-body" id="article-body">

</section>

</main>



<script>

async function loadArticle(){

const response = await fetch("latest-001.json")

const data = await response.json()

const article = data.items[0]

document.getElementById("article-title").textContent = article.title

document.getElementById("article-author").textContent = "By " + article.author

document.getElementById("article-location").textContent = article.location

document.getElementById("article-date").textContent = article.date

document.getElementById("article-read").textContent = article.readTime



const hero = document.getElementById("hero-image")

hero.src = "../images/" + article.heroImage.src

hero.alt = article.title



document.getElementById("hero-caption").innerHTML =
article.heroImage.caption +
" <span class='credit'>" + article.heroImage.credit + "</span>"


const bodyContainer = document.getElementById("article-body")

article.body.forEach(function(paragraph){

const p = document.createElement("p")

p.textContent = paragraph

bodyContainer.appendChild(p)

})

}

loadArticle()

</script>

</body>

</html>
