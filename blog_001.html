<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- FIXED: Ensure all paths resolve from site root -->
<base href="/">

<title id="page-title">Loading… | THE MIRROR JAMMU KASHMIR</title>
<link rel="stylesheet" href="styles.css?v=17">
</head>

<body class="article-page theme-maroon">

<main class="page-shell article-main">
<section class="article-container">
<div class="article-shell">

    <!-- SECTION LABEL -->
    <div id="section-label" class="section-title red-bar">Blog & Opinion</div>

    <!-- HEADER -->
    <header class="article-header">
        <h1 id="title">Loading…</h1>
        <div id="meta" class="article-meta"></div>
    </header>

    <!-- HERO IMAGE -->
    <figure id="heroWrap" class="article-hero">
        <img id="heroImg" src="" alt="">
        <figcaption id="heroCaption"></figcaption>
    </figure>

    <!-- CONTENT -->
    <div id="content" class="article-content"></div>

    <!-- ACTION BUTTONS -->
    <div class="page-actions">
        <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
        <input id="subscribeEmail" type="email" placeholder="Your email…" class="subscribe-input">
        <button id="subscribeBtn">🔔 Subscribe</button>
        <button data-share class="share-btn">📣 Share</button>
        <button data-copy-link class="copy-btn">🔗 Copy Link</button>
    </div>

</div>
</section>
</main>

<footer class="footer">
<p>© <span id="year"></span> THE MIRROR JAMMU KASHMIR. All rights reserved.</p>
</footer>

<!-- GLOBAL SCRIPT -->
<script src="script.js?v=19"></script>

<!-- BLOG PAGE LOADER -->
<script>
// YEAR
document.getElementById("year").textContent = new Date().getFullYear();

// LIKE
let likes = 0;
document.getElementById("likeBtn").onclick =
() => document.getElementById("likeCount").textContent = ++likes;

// SUBSCRIBE
document.getElementById("subscribeBtn").onclick = function(){
  this.textContent="Subscribed";
  this.disabled=true;
};

// SHARE
document.querySelector("[data-share]").onclick = () =>
  navigator.share
    ? navigator.share({title:document.title,url:location.href})
    : alert("Share not supported");

// COPY LINK
document.querySelector("[data-copy-link]").onclick =
  () => navigator.clipboard.writeText(location.href);

// GET BLOG ID
function getBlogId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

// LOAD BLOG JSON
async function loadBlog() {
  const id = getBlogId();
  if (!id) return;

  try {
    const res = await fetch(`content/${id}.json`, { cache: "no-store" });
    const item = await res.json();

    // TITLE
    document.getElementById("title").textContent = item.title;

    // META
    const dateObj = new Date(item.date);
    const formattedDate = dateObj.toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });

    document.getElementById("meta").innerHTML = `
      <strong>${item.category}</strong> ·
      ${item.location} ·
      ${formattedDate} ·
      ${item.readTime} ·
      ${item.author}
    `;

    // HERO IMAGE
    if (item.heroImage?.src) {
      document.getElementById("heroImg").src = item.heroImage.src;
      document.getElementById("heroCaption").textContent =
        `${item.heroImage.caption} — ${item.heroImage.credit}`;
    }

    // BODY
    const container = document.getElementById("content");
    container.innerHTML = "";

    item.body.forEach(block => {

      if (block.type === "paragraph") {
        container.innerHTML += `<p>${block.text}</p>`;
      }

      if (block.type === "header") {
        container.innerHTML += `<h2 style="margin-top:40px;">${block.text}</h2>`;
      }

      if (block.type === "points") {
        const items = block.items.map(i => `<li>${i}</li>`).join("");
        container.innerHTML += `
          <div class="important-points">
            <ul>${items}</ul>
          </div>
        `;
      }

      if (block.type === "image") {
        const align = block.align === "right" ? "img-right" : "img-left";
        container.innerHTML += `
          <figure class="${align}">
            <img src="${block.src}" alt="${block.caption}">
            <figcaption>${block.caption} — <em>${block.credit}</em></figcaption>
          </figure>
        `;
      }
    });

  } catch (err) {
    console.error("Failed to load blog JSON", err);
    document.getElementById("title").textContent = "Error loading blog";
  }
}

loadBlog();
</script>

</body>
</html>
