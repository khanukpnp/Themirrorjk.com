<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breaking News | The Mirror Jammu Kashmir</title>
<link rel="stylesheet" href="styles.css?v=6">
</head>

<body class="article-page theme-maroon">

<main class="main">

<section class="article-container">
<div class="article-shell">

<header class="article-header">
<h1>Breaking News</h1>
<div class="article-meta">
Latest developments and urgent updates
</div>
</header>

<div id="latestPosts"></div>

<h2 style="margin-top:60px;border-top:1px solid #ddd;padding-top:20px;">
Archive
</h2>

<div id="archivePosts"></div>

</div>
</section>

</main>

<footer class="footer">
<p>© <span id="year"></span> The Mirror Jammu Kashmir</p>
</footer>

<script>

document.getElementById("year").textContent =
new Date().getFullYear();

async function loadBreaking(){

const latestContainer =
document.getElementById("latestPosts");

const archiveContainer =
document.getElementById("archivePosts");

latestContainer.innerHTML = "";
archiveContainer.innerHTML = "";

try{

const res = await fetch(
"content/breaking.json",
{cache:"no-store"}
);

const data = await res.json();

if(!data.items || data.items.length === 0){

latestContainer.innerHTML =
'<p style="font-size:18px;color:#777;margin-top:30px;">No breaking news published yet.</p>';

return;
}

let items = data.items;

items.sort((a,b)=>
new Date(b.date) - new Date(a.date)
);

items.forEach(item=>{

const card =
document.createElement("div");

card.style.marginBottom = "50px";
card.style.paddingBottom = "30px";
card.style.borderBottom = "1px solid #e5e5e5";

card.innerHTML = `
<div style="display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;">

<img src="${item.image}"
     alt="${item.title}"
     style="
     width:35%;
     min-width:260px;
     height:auto;
     object-fit:cover;
     border-radius:2px;
     ">

<div style="flex:1;min-width:260px;">

<h3 style="
margin-top:0;
margin-bottom:8px;
font-size:24px;
line-height:1.3;
font-weight:600;
">
${item.title}
</h3>

<div style="
font-size:14px;
color:#777;
margin-bottom:12px;
">
${item.location ? item.location + " · " : ""}
${item.date} · ${item.readTime} · ${item.author}
</div>

<p style="
font-size:17px;
line-height:1.7;
margin-bottom:12px;
">
${item.excerpt}
</p>

<a href="article.html?id=${item.id}"
   style="
   color:#a00000;
   font-weight:600;
   text-decoration:none;
   ">
Read More →
</a>

</div>
</div>
`;

if(item.archive){
archiveContainer.appendChild(card);
}else{
latestContainer.appendChild(card);
}

});

if(archiveContainer.innerHTML === ""){
archiveContainer.innerHTML =
'<p style="color:#777;">No archived breaking news yet.</p>';
}

}catch(error){

latestContainer.innerHTML =
'<p style="color:red;">Unable to load breaking news.</p>';

}

}

loadBreaking();

</script>

</body>
</html>
