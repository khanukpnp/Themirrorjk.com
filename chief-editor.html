<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <title>Chief Editor | The Mirror Jammu Kashmir</title>
  <link rel="stylesheet" href="styles.css?v=4">
</head>

<body class="theme-maroon">

<header class="site-header">
  <div class="header-row">
    <img src="assets/logo.png" class="logo" alt="Logo">
    <h1 class="site-title">THE MIRROR JAMMU KASHMIR</h1>
    <img src="assets/logo.png" class="logo" alt="Logo">
  </div>
  <div class="subheading">
    CHAMPION JUSTICE & AMPLIFY THE VOICES OF THE UNHEARD… REVEALING THE TRUTH BEYOND BORDERS
  </div>
</header>

<main class="article-page">

  <article class="article-shell">

    <h1 id="title"></h1>
    <div id="meta" class="article-meta"></div>

    <div id="heroWrap" class="article-figure" style="display:none;">
      <img id="heroImg" src="">
      <figcaption id="heroCaption"></figcaption>
    </div>

    <div id="content" class="article-content"></div>

    <div class="article-actions">
      <button class="btn small">❤️ Like</button>
      <button class="btn small">🔔 Subscribe</button>
      <button class="btn small">📣 Share</button>
      <button class="btn small" onclick="navigator.clipboard.writeText(window.location.href)">🔗 Copy Link</button>
    </div>

  </article>

</main>

<footer class="footer">
  © <span id="year"></span> THE MIRROR JAMMU KASHMIR
</footer>

<script>
fetch("content/chief-editor.json")
  .then(res => res.json())
  .then(data => {

    document.getElementById("title").textContent = data.title;

    document.getElementById("meta").textContent =
      data.location + " · " + data.readTime;

    if(data.heroImage?.src){
      document.getElementById("heroWrap").style.display = "block";
      document.getElementById("heroImg").src = data.heroImage.src;
      document.getElementById("heroCaption").textContent =
        data.heroImage.caption + " © " + data.heroImage.credit;
    }

    const content = document.getElementById("content");
    content.innerHTML = "";

    data.body.forEach(block => {
      if(block.type === "paragraph"){
        const p = document.createElement("p");
        p.textContent = block.text;
        content.appendChild(p);
      }
    });

  });
</script>

<script src="script.js?v=4"></script>

</body>
</html>
