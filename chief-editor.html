<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chief Editor | The Mirror Jammu Kashmir</title>
<link rel="stylesheet" href="styles.css?v=8">
</head>

<body class="article-page theme-maroon">

<!-- PAGE SHELL (same as Article & About) -->
<main class="page-shell chief-editor-page">

  <section class="article-container">
    <div class="article-shell">

      <!-- HEADER -->
      <header class="article-header">
        <h1 id="title"></h1>
        <div id="meta" class="article-meta"></div>
      </header>

      <!-- HERO IMAGE (Loaded from JSON) -->
      <div id="heroWrap" class="hero-wrapper" style="display:none;">
        <figure class="chief-figure">
          <img id="heroImg" src="" alt="">
          <figcaption id="heroCaption"></figcaption>
        </figure>
      </div>

      <!-- CONTENT LOADED FROM JSON -->
      <div id="content" class="article-content"></div>

      <!-- ACTION BUTTONS -->
      <div class="page-actions">
        <!-- Optional buttons can be added here -->
      </div>

    </div>
  </section>

</main>

<script src="script.js?v=8"></script>
</body>
</html>
