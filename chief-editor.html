<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chief Editor | The Mirror Jammu Kashmir</title>
<link rel="stylesheet" href="styles.css?v=6">
</head>

<body class="article-page theme-maroon">

<main class="main">

  <section class="article-container">
    <div class="article-shell">

      <!-- HEADER -->
      <header class="article-header">
        <h1 id="title"></h1>
        <div id="meta" class="article-meta"></div>
      </header>

      <!-- HERO IMAGE (Loaded from JSON) -->
      <div id="heroWrap" style="display:none;">
        <figure class="article-figure" style="float:right;width:35%;margin:8px 0 14px 20px;">
          <img id="heroImg" src="" alt="" style="width:100%;height:auto;">
          <figcaption id="heroCaption"></figcaption>
        </figure>
      </div>

      <!-- CONTENT LOADED FROM JSON -->
      <div id="content" class="article-content"></div>

      <!-- ACTION BUTTONS -->
      <div class="page-actions">
