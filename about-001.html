<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | THE MIRROR JAMMU KASHMIR</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .about-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .about-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #b30000;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
        }
        .about-subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }
        .about-meta {
            color: #666;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }
        .about-content {
            font-family: 'Georgia', serif;
            line-height: 1.8;
            color: #333;
        }
        .about-content p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
        }
        .about-content .pull-quote {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 2rem 0;
            padding: 1.5rem 2rem;
            background: #f9f9f9;
            border-left: 4px solid #b30000;
            font-style: italic;
        }
        .about-content .img-right {
            float: right;
            width: 38%;
            margin: 0 0 1rem 1.5rem;
        }
        .about-content .img-left {
            float: left;
            width: 38%;
            margin: 0 1.5rem 1rem 0;
        }
        .about-content .img-center {
            display: block;
            margin: 2rem auto;
            text-align: center;
        }
        .about-content figure img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .about-content figcaption {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
            font-style: italic;
            text-align: center;
        }
        @media (max-width: 768px) {
            .about-content .img-right,
            .about-content .img-left {
                float: none;
                width: 100%;
                margin: 1.5rem 0;
            }
        }
    </style>
</head>
<body>
    <main class="about-page">
        <h1 id="about-title" class="about-title"></h1>
        <div id="about-subtitle" class="about-subtitle"></div>
        <div id="about-meta" class="about-meta"></div>
        <div id="about-content" class="about-content"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
