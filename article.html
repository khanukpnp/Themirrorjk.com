<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article | The Mirror Jammu Kashmir</title>

<style>
.article-page {
  max-width: 860px;
  margin: 32px auto;
  padding: 0 16px;
  font-family: inherit;
}

/* ===== HERO PLACEHOLDER CARD ===== */
.hero-card {
  height: 220px;
  background: #eee;
  border-radius: 8px;
  overflow: hidden;
  margin-bottom: 14px;
}
.hero-card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ===== HEADER ===== */
.article-header h1 {
  font-size: 32px;
  line-height: 1.25;
  margin: 8px 0;
}
.article-meta {
  font-size: 14px;
  color: #555;
  margin-bottom: 24px;
}

/* ===== BODY ===== */
.article-content {
  font-size: 17px;
  line-height: 1.7;
  color: #111;
}
.article-content p {
  margin-bottom: 16px;
}
.article-content strong {
  font-weight: 600;
}

/* ===== IMAGES ===== */
.img-full img {
  width: 100%;
  border-radius: 6px;
  margin: 20px 0;
}
.img-float {
  width: 35%;
  margin: 6px 0 12px;
}
.img-right { float:right; margin-left:16px; }
.img-left { float:left; margin-right:16px; }
.img-float img {
  width: 100%;
  border-radius: 6px;
}
.figcap {
  font-size: 13px;
  color: #555;
}
.clear { clear:both; }

/* ===== ACTIONS ===== */
.article-actions {
  display:flex;
  gap:12px;
  margin-top:32px;
  flex-wrap:wrap;
}
.article-actions button {
  font-size:14px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid #ccc;
  background:#fff;
  cursor:pointer;
}

/* ===== FADE IN ===== */
.fade {
  opacity:0;
  transform:translateY(10px);
  animation:fadeIn .6s ease forwards;
}
@keyframes fadeIn {
  to { opacity:1; transform:none; }
}

/* ===== MOBILE ===== */
@media(max-width:768px){
  .img-float { float:none; width:100%; margin:16px 0; }
  .hero-card { height:180px; }
}
</style>
</head>

<body>

<main class="article-page">

<div id="hero" class="hero-card" hidden></div>

<header class="article-header">
  <h1 id="title">Loading…</h1>
  <div id="meta" class="article-meta"></div>
</header>

<section id="content" class="article-content"></section>

<div class="article-actions">
  <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
  <button id="subBtn">🔔 Subscribe</button>
  <button id="shareBtn">📣 Share</button>
  <button id="copyBtn">🔗 Copy Link</button>
</div>

</main>

<script>
(async () => {

const id = new URLSearchParams(location.search).get("id");
if(!id) return;

const res = await fetch("content/articles.json",{cache:"no-store"});
const data = await res.json();
const a = data.items.find(x=>x.id===id);
if(!a) return;

/* Header */
document.title = a.title;
title.textContent = a.title;
meta.textContent = `${a.location || ""} · ${a.date} · ${a.readTime}`;

/* Hero placeholder */
if(a.image){
  hero.hidden=false;
  hero.innerHTML=`<img src="${a.image}" alt="${a.title}">`;
}

/* Body */
let floatSide="right";
a.body.forEach(b=>{
  if(b.type==="paragraph"){
    const p=document.createElement("p");
    p.innerHTML=b.text
      .replace(/(complete shutter down|public frustration)/gi,"<strong>$1</strong>");
    p.className="fade";
    content.appendChild(p);
  }

  if(b.type==="image"){
    const div=document.createElement("div");
    if(!document.querySelector(".img-full")){
      div.className="img-full fade";
    }else{
      div.className=`img-float img-${floatSide} fade`;
      floatSide = floatSide==="right"?"left":"right";
    }
    div.innerHTML=`<img src="${b.src}" alt=""><div class="figcap">${b.alt||""}</div>`;
    content.appendChild(div);
    const clr=document.createElement("div");
    clr.className="clear";
    content.appendChild(clr);
  }
});

/* Actions */
let likes=0;
likeBtn.onclick=()=>{ likeCount.textContent=++likes; };
subBtn.onclick=()=>{ subBtn.textContent="Subscribed"; subBtn.disabled=true; };
shareBtn.onclick=()=> navigator.share ? navigator.share({title:a.title,url:location.href}) : alert("Share not supported");
copyBtn.onclick=()=>{ navigator.clipboard.writeText(location.href); alert("Link copied"); };

})();
</script>

</body>
</html>
