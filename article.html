<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read verified reporting from The Mirror Jammu Kashmir." />

  <style>
    .article-page {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: inherit;
    }

    /* ===== EDITORIAL PLACEHOLDER CARD ===== */
    .editorial-placeholder {
      max-height: 220px;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 16px;
      background: #eee;
    }

    .editorial-placeholder img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .editorial-caption {
      font-size: 13px;
      color: #555;
      padding: 6px 10px;
      background: #fafafa;
    }

    /* ===== HEADER ===== */
    .article-header h1 {
      font-size: 32px;
      line-height: 1.25;
      margin: 12px 0 8px;
    }

    .article-meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }

    /* ===== BODY ===== */
    .article-content {
      font-size: 17px;
      line-height: 1.7;
      color: #111;
    }

    .article-content p {
      margin-bottom: 16px;
    }

    .article-content strong {
      font-weight: 600;
    }

    /* ===== FULL WIDTH IMAGE ===== */
    .img-full {
      margin: 22px 0;
    }

    .img-full img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    /* ===== INLINE FLOAT IMAGES ===== */
    .img-float {
      width: 35%;
      margin: 6px 0 10px;
    }

    .img-right {
      float: right;
      margin-left: 16px;
    }

    .img-left {
      float: left;
      margin-right: 16px;
    }

    .img-float img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    .img-caption {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .img-credit {
      font-size: 12px;
      color: #777;
    }

    .clear {
      clear: both;
    }

    /* ===== ACTIONS ===== */
    .article-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .article-actions button {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .img-float {
        float: none;
        width: 100%;
        margin: 16px 0;
      }

      .editorial-placeholder img {
        height: 180px;
      }
    }
  </style>
</head>

<body>

<main class="article-page">

  <!-- EDITORIAL PLACEHOLDER -->
  <div id="editorialHero" class="editorial-placeholder" hidden></div>

  <header class="article-header">
    <h1 id="title">Loading…</h1>
    <div class="article-meta" id="meta"></div>
  </header>

  <section class="article-content" id="content"></section>

  <div class="article-actions">
    <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
    <button id="subscribeBtn">🔔 Subscribe</button>
    <button id="shareBtn">📣 Share</button>
    <button id="copyBtn">🔗 Copy Link</button>
  </div>

</main>

<script>
(async function () {

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (!id) return;

  const res = await fetch("content/articles.json", { cache: "no-store" });
  const data = await res.json();
  const article = data.items.find(a => a.id === id);
  if (!article) return;

  document.getElementById("title").textContent = article.title;
