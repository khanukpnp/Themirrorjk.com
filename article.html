<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read verified reporting from The Mirror Jammu Kashmir." />

  <!-- Scoped styles only -->
  <style>
    .article-page {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: inherit;
    }

    /* ===== HERO PLACEHOLDER CARD ===== */
    .hero-card {
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      background: #f2f2f2;
    }

    .hero-card img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .hero-caption {
      font-size: 13px;
      color: #555;
      padding: 8px 12px;
      background: #fafafa;
    }

    /* ===== HEADER ===== */
    .article-header h1 {
      font-size: 32px;
      line-height: 1.25;
      margin: 16px 0 10px;
    }

    .article-meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }

    /* ===== BODY ===== */
    .article-content {
      font-size: 17px;
      line-height: 1.7;
      color: #111;
    }

    .article-content p {
      margin-bottom: 16px;
    }

    .article-content p strong {
      font-weight: 600;
    }

    /* ===== FULL WIDTH IMAGE ===== */
    .img-full {
      margin: 24px 0;
    }

    .img-full img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    /* ===== INLINE FLOAT IMAGES ===== */
    .img-float {
      width: 35%;
      margin: 6px 0 12px;
    }

    .img-right {
      float: right;
      margin-left: 16px;
    }

    .img-left {
      float: left;
      margin-right: 16px;
    }

    .img-float img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    .img-caption {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .img-credit {
      font-size: 12px;
      color: #777;
    }

    /* Clear floats */
    .clearfix {
      clear: both;
    }

    /* ===== ACTIONS ===== */
    .article-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .article-actions button {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    /* ===== FADE IN ===== */
    .fade-in {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .6s ease, transform .6s ease;
    }

    .fade-in.loaded {
      opacity: 1;
      transform: none;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .img-float {
        float: none;
        width: 100%;
        margin: 16px 0;
      }
    }
  </style>
</head>

<body>

<main class="article-page">

  <!-- HERO PLACEHOLDER -->
  <div id="hero" class="hero-card" hidden></div>

  <header class="article-header">
    <h1 id="title">Loading…</h1>
    <div class="article-meta" id="meta"></div>
  </header>

  <section class="article-content" id="content"></section>

  <div class="article-actions">
    <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
    <button id="subscribeBtn">🔔 Subscribe</button>
    <button id="shareBtn">📣 Share</button>
    <button id="copyBtn">🔗 Copy Link</button>
  </div>

</main>

<script>
(async function () {

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if (!id) return;

  const res = await fetch("content/articles.json", { cache: "no-store" });
  const data = await res.json();
  const article = data.items.find(a => a.id === id);

  if (!article) {
    document.getElementById("title").textContent = "Article not found";
    return;
  }

  document.title = article.title + " | The Mirror Jammu Kashmir";
  document.getElementById("title").textContent = article.title;

  document.getElementById("meta").textContent =
    (article.location || "") + " | " + article.date + " • " + article.readTime;

  /* ===== HERO PLACEHOLDER ===== */
  if (article.heroImage) {
    const hero = document.getElementById("hero");
    hero.hidden = false;

    hero.innerHTML = `
      <img src="${article.heroImage.src}" loading="lazy" class="fade-in">
      <div class="hero-caption">
        ${article.heroImage.caption || ""}
        ${article.heroImage.credit ? " • " + article.heroImage.credit : ""}
      </div>
    `;
  }

  const content = document.getElementById("content");
  let floatToggle = "right";
  let firstImageRendered = false;

  article.body.forEach(block => {

    if (block.type === "paragraph") {
      const p = document.createElement("p");
      p.innerHTML = block.text
        .replace("complete shutter down", "<strong>complete shutter down</strong>")
        .replace("collective punishment", "<strong>collective punishment</strong>");
      content.appendChild(p);
    }

    if (block.type === "image") {

      // First body image = full width
      if (!firstImageRendered) {
        firstImageRendered = true;

        const wrap = document.createElement("div");
        wrap.className = "img-full fade-in";

        wrap.innerHTML = `
          <img src="${block.src}" loading="lazy">
          <div class="img-caption">${block.caption || ""}</div>
          <div class="img-credit">${block.credit || ""}</div>
        `;

        content.appendChild(wrap);
        return;
      }

      const wrap = document.createElement("div");
      wrap.className = `img-float img-${floatToggle} fade-in`;

      wrap.innerHTML = `
        <img src="${block.src}" loading="lazy">
        <div class="img-caption">${block.caption || ""}</div>
        <div class="img-credit">${block.credit || ""}</div>
      `;

      content.appendChild(wrap);

      const clear = document.createElement("div");
      clear.className = "clearfix";
      content.appendChild(clear);

      floatToggle = floatToggle === "right" ? "left" : "right";
    }

  });

  /* ===== FADE IN ===== */
  requestAnimationFrame(() => {
    document.querySelectorAll(".fade-in").forEach(el => {
      el.classList.add("loaded");
    });
  });

  /* ===== ACTIONS ===== */
  let likes = 0;
  document.getElementById("likeBtn").onclick = () => {
    likes++;
    document.getElementById("likeCount").textContent = likes;
  };

  document.getElementById("subscribeBtn").onclick = e => {
    e.target.textContent = "Subscribed";
    e.target.disabled = true;
  };

  document.getElementById("shareBtn").onclick = () => {
    if (navigator.share) {
      navigator.share({ title: article.title, url: location.href });
    } else {
      navigator.clipboard.writeText(location.href);
      alert("Link copied");
    }
  };

  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(location.href);
    alert("Link copied");
  };

})();
</script>

<!-- SEO SCHEMA -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": "{{title}}",
  "datePublished": "{{date}}",
  "author": {
    "@type": "Organization",
    "name": "The Mirror Jammu Kashmir"
  },
  "publisher": {
    "@type": "Organization",
    "name": "The Mirror Jammu Kashmir"
  }
}
</script>

</body>
</html>
