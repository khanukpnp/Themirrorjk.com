        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; background: white; }
        body { font-family: 'Source Sans Pro', sans-serif; background: white; color: #222; line-height: 1.5; overflow-x: hidden; }

        .loader-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; color: #fff; font-family: 'Playfair Display', serif; }
        .loader-bar { width: 100%; height: 3px; background: #333; border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
        .loader-progress { width: 0%; height: 100%; background: #b30000; animation: loader-progress 1.5s ease forwards; }
        @keyframes loader-progress { 0% { width: 0%; } 100% { width: 100%; } }
        #site-loader p { font-size: 0.85rem; color: #ccc; margin-top: 8px; }
        .site-header { text-align: center; padding: 30px 20px 20px; background: white; border-bottom: 2px solid #b30000; width: 100%; }
        .site-title { font-size: 3rem; font-weight: 900; color: #000; text-transform: uppercase; font-family: 'Playfair Display', serif; }
        .subheading { font-size: 1.1rem; color: #b30000; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
        .info-bar { background: #f8f8f8; padding: 6px 20px; border-bottom: 1px solid #ddd; font-size: 0.8rem; width: 100%; }
        .info-items { display: flex; justify-content: center; align-items: center; gap: 8px; max-width: 1400px; margin: 0 auto; overflow-x: auto; white-space: nowrap; }
        .info-items span { color: #333; font-size: 0.8rem; }
        .info-items .separator { color: #999; margin: 0 2px; }
        .info-items strong { color: #b30000; }
        .weather-bar { background: #fff; border-bottom: 2px solid #b30000; padding: 5px 20px; }
        .ticker-wrap { background: #111; color: white; padding: 8px 0; border-bottom: 2px solid #b30000; overflow: hidden; }
        .ticker { display: flex; align-items: center; max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .ticker-label { background: #b30000; padding: 4px 14px; font-weight: bold; margin-right: 15px; font-size: 0.85rem; text-transform: uppercase; }
        .ticker-items { display: inline-flex; gap: 40px; animation: ticker-scroll 440s linear infinite; }
        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .navbar { background: #800000; border-bottom: 2px solid #b30000; }
        .nav-list { display: flex; list-style: none; justify-content: center; max-width: 1400px; margin: 0 auto; }
        .nav-btn { display: block; padding: 12px 18px; color: white; text-decoration: none; font-weight: 600; }
        .article-page { max-width: 850px; margin: 40px auto; padding: 0 20px; background: white; }
        .category-label { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; color: #b30000; letter-spacing: 1px; }
        #title { font-size: 2.5rem; font-weight: 900; line-height: 1.25; margin-bottom: 15px; font-family: 'Playfair Display', serif; color: #111; }
        .article-meta { font-size: 0.9rem; color: #666; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #e0e0e0; }
        .article-meta strong { color: #111; }
        .hero-image-container { margin-bottom: 25px; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 4px; }
        #heroImg { width: 100%; height: 100%; object-fit: cover; }
        #heroCaption { font-size: 0.85rem; color: #666; margin-top: 8px; font-style: italic; border-left: 3px solid #b30000; padding-left: 10px; }
        #content { font-family: 'Source Sans Pro', sans-serif; font-size: 1.15rem; line-height: 1.8; color: #222; }
        #content p { margin-bottom: 1.5rem; }
        #content .mid-subheading { font-size: 1.6rem; font-weight: 700; margin: 2rem 0 1rem; font-family: 'Playfair Display', serif; color: #b30000; }
        #content .pull-quote { font-size: 1.3rem; font-weight: 600; margin: 2rem 0; padding: 1.5rem 2rem; background: #f9f9f9; border-left: 4px solid #b30000; font-style: italic; color: #333; }
        .loading-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; color: #666; }
        .loading-state .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #b30000; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .footer { background: #800000; color: white; text-align: center; padding: 20px; margin-top: 40px; font-size: 0.85rem; }

<body>
<div class="reading-progress" id="reading-progress"></div>
<div id="site-loader">
    <div class="loader-inner">
        <div class="loader-title">THE MIRROR JAMMU KASHMIR</div>
        <div class="loader-bar"><div class="loader-progress"></div></div>
        <p>Loading article...</p>
    </div>
</div>
<header class="site-header">
    <div class="subheading">CHAMPION JUSTICE & AMPLIFY THE VOICES OF THE UNHEARD</div>
    <h1 class="site-title">THE MIRROR JAMMU KASHMIR</h1>
</header>
<div class="info-bar"><div class="info-items" id="datetime-bar"></div></div>
<div class="weather-bar"><div class="info-items" id="weather-bar"></div></div>
<div class="ticker-wrap">
    <div class="ticker">
        <div class="ticker-label">🆕 BREAKING</div>
        <div class="ticker-items" id="ticker-items"></div>
    </div>
</div>
<nav class="navbar">
    <ul class="nav-list">
        <li class="nav-item"><a href="index.html" class="nav-btn">🏠 Home</a></li>
        <li class="nav-item"><a href="about.html" class="nav-btn">📖 About Us</a></li>
        <li class="nav-item"><a href="chief-editor.html" class="nav-btn">✍️ Chief Editor</a></li>
    </ul>
</nav>

<main class="article-page">
    <div id="heroWrap" class="hero-image-container" style="display: none;">
        <img id="heroImg" src="" alt="">
        <div id="heroCaption"></div>
    </div>
    <div id="section-label" class="category-label"></div>
    <h1 id="title"></h1>
    <div id="meta" class="article-meta"></div>
    
    <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <p>Loading document content...</p>
    </div>
    <div id="content" style="display: none;"></div>
</main>

<footer class="footer">
    <p>© <span id="year"></span> THE MIRROR JAMMU KASHMIR. All rights reserved.</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", function() {
    initLoader();
    initYear();
    updateClocks();
    initWeatherBar();
    initTicker();
    
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get("id");
    
    if (articleId) {
        loadArticle(articleId.toLowerCase());
    } else {
        showError("No target article specified.");
    }
});

function initLoader() {
    const loader = document.getElementById("site-loader");
    if (loader) setTimeout(() => { loader.style.opacity = "0"; setTimeout(() => loader.style.display = "none", 300); }, 800);
}
function initYear() {
    const yearEl = document.getElementById("year");
    if (yearEl) yearEl.textContent = new Date().getFullYear();
}
function updateClocks() {
    const now = new Date();
    const bar = document.getElementById("datetime-bar");
    if (bar) bar.innerHTML = `<span>${now.toLocaleDateString("en-GB", { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>`;
}
function initWeatherBar() {
    const bar = document.getElementById("weather-bar");
    if (bar) bar.innerHTML = `<span>Zurich: <strong>6°C</strong></span> • <span>Rawalakot: <strong>9°C</strong></span> • <span>Muzaffarabad: <strong>10°C</strong></span>`;
}
function initTicker() {
    const items = document.getElementById("ticker-items");
    if (items) items.innerHTML = `<span>THE MIRROR JAMMU KASHMIR --- CHAMPION JUSTICE & AMPLIFY UNHEARD VOICES • </span>`;
}

async function loadArticle(articleId) {
    const loadingDiv = document.getElementById('loading-state');
    const contentDiv = document.getElementById('content');
    const cb = "?v=" + new Date().getTime(); // Cache buster
    
    let articleData = null;
    
    // 1. Fetch direct JSON file from content/
    try {
        const response = await fetch(`content/${articleId}.json${cb}`);
        if (response.ok) {
            const data = await response.json();
            articleData = data.items ? data.items[0] : data;
        }
    } catch (e) {
        console.warn("Direct JSON fetch failed, checking master array...");
    }
    
    // 2. Fallback: Search inside master article array if direct fetch fails
    if (!articleData) {
        try {
            const response = await fetch(`content/article.json${cb}`);
            if (response.ok) {
                const master = await response.json();
                const items = master.items || master || [];
                articleData = items.find(a => a.id && a.id.toLowerCase() === articleId);
            }
        } catch (e) {
            console.error("Master database fetch failed.");
        }
    }

    if (!articleData) {
        showError(`Article target "${articleId}" could not be loaded.`);
        return;
    }

    renderArticle(articleData);
}

function renderArticle(article) {
    const loadingDiv = document.getElementById('loading-state');
    const contentDiv = document.getElementById('content');
    const heroWrap = document.getElementById('heroWrap');
    const heroImg = document.getElementById('heroImg');
    const heroCaption = document.getElementById('heroCaption');
    const titleEl = document.getElementById('title');
    const sectionLabel = document.getElementById('section-label');
    const metaEl = document.getElementById('meta');

    document.title = `${article.title || 'Article'} | THE MIRROR JAMMU KASHMIR`;

    if (titleEl) titleEl.textContent = article.title || '';
    if (sectionLabel) sectionLabel.textContent = article.category || article.sectionLabel || 'REPORT';

    if (metaEl) {
        let dateStr = article.date ? new Date(article.date).toLocaleDateString("en-GB", { year: 'numeric', month: 'long', day: 'numeric' }) : '';
        metaEl.innerHTML = `By <strong>${article.author || 'Editorial Desk'}</strong> ${article.location ? '| ' + article.location : ''} | ${dateStr} | ⏱️ ${article.readTime || '5 min read'}`;
    }

    if (article.heroImage && heroWrap && heroImg) {
        let src = typeof article.heroImage === 'string' ? article.heroImage : article.heroImage.src;
        let cap = article.heroImage.caption || '';
        if (src) {
            heroImg.src = src;
            heroWrap.style.display = 'block';
            if (heroCaption) heroCaption.textContent = cap;
        }
    }

    if (contentDiv) {
        contentDiv.innerHTML = renderJSONBody(article.body || article.content);
        contentDiv.style.display = 'block';
    }

    if (loadingDiv) loadingDiv.style.display = 'none';
}

function renderJSONBody(body) {
    if (!body) return '<p>No content text provided.</p>';
    if (typeof body === 'string') return `<p>${body}</p>`;
    
    if (Array.isArray(body)) {
        return body.map(block => {
            switch (block.type) {
                case 'paragraph': return `<p>${block.text}</p>`;
                case 'subheading':
                case 'header': return `<h2 class="mid-subheading">${block.text}</h2>`;
                case 'pullquote': return `<div class="pull-quote">${block.text}</div>`;
                case 'points':
                    return `<ul>${(block.items || []).map(i => `<li>${i}</li>`).join('')}</ul>`;
                case 'image':
                    return `<figure><img src="${block.src}" alt="Media"><figcaption>${block.caption || ''}</figcaption></figure>`;
                default: return '';
            }
        }).join('');
    }
    return '';
}

function showError(msg) {
    const loadingDiv = document.getElementById('loading-state');
    const contentDiv = document.getElementById('content');
    if (loadingDiv) loadingDiv.style.display = 'none';
    if (contentDiv) {
        contentDiv.style.display = 'block';
        contentDiv.innerHTML = `<div style="text-align:center; padding:40px;"><h3 style="color:#b30000;">Publication Loading Error</h3><p style="color:#666; margin:10px 0;">${msg}</p><a href="index.html" style="display:inline-block; margin-top:15px; background:#b30000; color:#fff; padding:8px 16px; border-radius:4px; text-decoration:none;">Return to Homepage</a></div>`;
    }
}
</script>
