<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read the latest reporting from The Mirror Jammu Kashmir." />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <!-- keep your existing header exactly as it is on index.html -->
  </header>

  <main class="container">
    <section class="content-block article-page">
      <h1 id="article-title" class="page-title">Loading...</h1>

      <div class="meta-row">
        <div id="article-meta" class="meta"></div>
      </div>

      <div class="article-body">
        <img id="article-image" class="inline-img-right" src="sample-1.jpg" alt="" loading="lazy" />
        <div id="article-content" class="article-content"></div>
      </div>

      <div class="page-actions" data-actions>
        <button type="button" class="action-btn" data-like>👍 Like <span data-like-count>0</span></button>
        <button type="button" class="action-btn" data-copy>🔗 Copy Link</button>
        <button type="button" class="action-btn" data-share>📤 Share</button>
      </div>
    </section>
  </main>

  <footer>
    <!-- keep your existing footer exactly as it is -->
    <div class="footer-copy">© The Mirror Jammu Kashmir</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
