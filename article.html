<script>
(async()=>{

try{

const id=new URLSearchParams(location.search).get("id");
if(!id){
  console.error("No article ID in URL");
  return;
}

const res=await fetch("content/articles.json");
if(!res.ok){
  console.error("Failed to load JSON");
  return;
}

const data=await res.json();

if(!data.items){
  console.error("JSON structure incorrect");
  return;
}

const a=data.items.find(x=>x.id===id);

if(!a){
  console.error("Article not found:", id);
  return;
}

/* TITLE */
document.getElementById("title").textContent=a.title;
document.getElementById("meta").textContent=
  `${a.location||""} · ${a.date} · ${a.readTime}`;

/* HERO */
if(a.heroImage && a.heroImage.src){
  document.getElementById("heroWrap").style.display="block";
  document.getElementById("heroImg").src=a.heroImage.src;
  document.getElementById("heroCaption").innerHTML=
    `${a.heroImage.caption||""} ${a.heroImage.credit? "© "+a.heroImage.credit : ""}`;
}

/* BODY */
const content=document.getElementById("content");

a.body.forEach(block=>{

  if(block.type==="paragraph"){
    const p=document.createElement("p");
    p.textContent=block.text;
    content.appendChild(p);
  }

  if(block.type==="image"){
    const figure=document.createElement("figure");
    figure.className="article-figure";
    figure.style.width="36%";
    figure.style.float=block.align==="left"?"left":"right";
    figure.style.margin=
      block.align==="left"?"8px 20px 12px 0":"8px 0 12px 20px";

    figure.innerHTML=`
      <img src="${block.src}" alt="">
      <figcaption style="font-size:13px;color:#555;margin-top:6px;">
        ${block.caption||""}
        ${block.credit? " © "+block.credit : ""}
      </figcaption>
    `;

    content.appendChild(figure);
  }

});

}catch(err){
  console.error("Article script crashed:", err);
}

})();
</script>
