<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Article | The Mirror Jammu Kashmir</title>

<style>
.article-page{
  max-width:820px;
  margin:40px auto;
  padding:0 16px;
  font-family:inherit;
}
.article-header h1{
  font-size:34px;
  line-height:1.25;
  margin-bottom:10px;
}
.article-meta{
  font-size:14px;
  color:#555;
  margin-bottom:22px;
}

/* HERO PLACEHOLDER */
.hero-placeholder{
  height:280px;
  border-radius:8px;
  background:#f3f3f3;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:24px 0 36px;
}
.hero-placeholder span{
  font-size:22px;
  font-weight:600;
  color:#999;
}

/* ARTICLE BODY */
.article-content{
  font-size:17px;
  line-height:1.7;
  color:#111;
}
.article-content p{
  margin-bottom:16px;
}

/* INLINE IMAGES */
.inline-img{
  width:35%;
  margin:8px 0 16px;
}
.inline-right{
  float:right;
  margin-left:16px;
}
.inline-left{
  float:left;
  margin-right:16px;
}
.inline-img img{
  width:100%;
  border-radius:6px;
}

/* CLEAR FLOATS */
.clearfix::after{
  content:"";
  display:block;
  clear:both;
}

/* ACTIONS */
.article-actions{
  display:flex;
  gap:12px;
  margin-top:32px;
  flex-wrap:wrap;
}
.article-actions button{
  font-size:14px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid #ccc;
  background:#fff;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:700px){
  .inline-img{
    float:none !important;
    width:100%;
    margin:16px 0;
  }
}
</style>
</head>

<body>

<main class="article-page">

<header class="article-header">
  <h1 id="title">Loading…</h1>
  <div class="article-meta" id="meta"></div>
</header>

<!-- HERO PLACEHOLDER -->
<div class="hero-placeholder">
  <span>Editorial Image Placeholder</span>
</div>

<section class="article-content clearfix" id="content"></section>

<div class="article-actions">
  <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
  <button id="subscribeBtn">🔔 Subscribe</button>
  <button id="shareBtn">📣 Share</button>
  <button id="copyBtn">🔗 Copy Link</button>
</div>

</main>

<script>
(async function(){

const params=new URLSearchParams(location.search);
const id=params.get("id");
if(!id){
  document.getElementById("title").textContent="Article not found";
  return;
}

const res=await fetch("content/articles.json",{cache:"no-store"});
const data=await res.json();
const article=data.items.find(a=>a.id===id);
if(!article){
  document.getElementById("title").textContent="Article not found";
  return;
}

document.title=article.title+" | The Mirror Jammu Kashmir";
document.getElementById("title").textContent=article.title;
document.getElementById("meta").textContent=
(article.location||"")+" | "+article.date+" • "+article.readTime;

const content=document.getElementById("content");
let imgIndex=0;

article.body.forEach(block=>{

  if(block.type==="paragraph"){
    const p=document.createElement("p");
    p.innerHTML=block.text
      .replace(/collective punishment/i,"<strong>collective punishment</strong>")
      .replace(/indefinite sit in/i,"<strong>indefinite sit in</strong>");
    content.appendChild(p);
  }

  if(block.type==="image"){
    imgIndex++;
    const wrap=document.createElement("div");
    wrap.className="inline-img "+(imgIndex===1?"inline-right":"inline-left");
    wrap.innerHTML=`<img src="${block.src}" alt="${block.alt||""}" loading="lazy">`;
    content.appendChild(wrap);
  }
});

/* LIKE */
let likes=0;
document.getElementById("likeBtn").onclick=()=>{
  likes++;
  document.getElementById("likeCount").textContent=likes;
};

/* SUBSCRIBE */
document.getElementById("subscribeBtn").onclick=e=>{
  e.target.textContent="Subscribed";
  e.target.disabled=true;
};

/* SHARE */
document.getElementById("shareBtn").onclick=()=>{
  if(navigator.share){
    navigator.share({title:article.title,url:location.href});
  }else{
    navigator.clipboard.writeText(location.href);
    alert("Link copied");
  }
};

/* COPY */
document.getElementById("copyBtn").onclick=()=>{
  navigator.clipboard.writeText(location.href);
  alert("Link copied");
};

})();
</script>

</body>
</html>
