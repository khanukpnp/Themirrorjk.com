<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read verified reporting from The Mirror Jammu Kashmir." />

  <!-- Scoped styles only -->
  <style>
    .article-page {
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: inherit;
    }

    .article-header h1 {
      font-size: 32px;
      line-height: 1.25;
      margin-bottom: 12px;
    }

    .article-meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }

    .article-content {
      font-size: 17px;
      line-height: 1.7;
      color: #111;
    }

    .article-content p {
      margin-bottom: 16px;
    }

    .article-image {
      margin: 28px 0;
    }

    .article-image img {
      width: 100%;
      border-radius: 6px;
    }

    .article-actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .article-actions button {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    .article-actions button.active {
      background: #f2f2f2;
    }
  </style>
</head>

<body>

<main class="article-page">

  <header class="article-header">
    <h1 id="title">Loading…</h1>
    <div class="article-meta" id="meta"></div>
  </header>

  <section class="article-content" id="content"></section>

  <figure class="article-image" id="image" hidden>
    <img alt="Article image">
  </figure>

  <div class="article-actions">
    <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
    <button id="subscribeBtn">🔔 Subscribe</button>
    <button id="shareBtn">📣 Share</button>
    <button id="copyBtn">🔗 Copy Link</button>
  </div>

</main>

<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get("slug");

  if (!slug) return;

  const res = await fetch("content/articles.json");
  const data = await res.json();
  const article = data.items.find(a => a.slug === slug);

  if (!article) {
    document.getElementById("title").textContent = "Article not found";
    return;
  }

  document.title = article.title + " | The Mirror Jammu Kashmir";
  document.getElementById("title").textContent = article.title;

  document.getElementById("meta").textContent =
    article.location + " | " + article.date + " • " + article.readTime;

  document.getElementById("content").innerHTML =
    article.body.map(p => `<p>${p}</p>`).join("");

  if (article.image) {
    const fig = document.getElementById("image");
    fig.hidden = false;
    fig.querySelector("img").src = article.image;
  }

  // Like
  let likes = 0;
  document.getElementById("likeBtn").onclick = () => {
    likes++;
    document.getElementById("likeCount").textContent = likes;
  };

  // Subscribe
  document.getElementById("subscribeBtn").onclick = e => {
    e.target.classList.toggle("active");
  };

  // Share
  document.getElementById("shareBtn").onclick = () => {
    if (navigator.share) {
      navigator.share({ title: article.title, url: location.href });
    }
  };

  // Copy
  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(location.href);
  };
})();
</script>

</body>
</html>
