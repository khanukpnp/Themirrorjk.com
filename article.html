<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read verified reporting from The Mirror Jammu Kashmir." />

  <style>
    .article-page {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: inherit;
    }

    /* ===== EDITORIAL PLACEHOLDER ===== */
    .editorial-placeholder {
      height: 220px;
      background: #f0f0f0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .editorial-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .editorial-placeholder img.loaded {
      opacity: 1;
    }

    .editorial-placeholder span {
      font-size: 15px;
      color: #777;
    }

    /* ===== HEADER ===== */
    .article-header h1 {
      font-size: 32px;
      line-height: 1.25;
      margin: 10px 0 8px;
    }

    .article-meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }

    /* ===== BODY ===== */
    .article-content {
      font-size: 17px;
      line-height: 1.7;
      color: #111;
    }

    .article-content p {
      margin-bottom: 16px;
    }

    .article-content strong {
      font-weight: 600;
    }

    /* ===== IMAGES ===== */
    .img-full {
      margin: 24px 0;
    }

    .img-full img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    .img-float {
      width: 35%;
      margin: 6px 0 12px;
    }

    .img-right {
      float: right;
      margin-left: 16px;
    }

    .img-left {
      float: left;
      margin-right: 16px;
    }

    .img-float img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    .img-caption {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }

    .img-credit {
      font-size: 12px;
      color: #777;
    }

    .clear {
      clear: both;
    }

    /* ===== ACTIONS ===== */
    .article-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .article-actions button {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .img-float {
        float: none;
        width: 100%;
        margin: 18px 0;
      }
    }
  </style>
</head>

<body>

<main class="article-page">

  <!-- EDITORIAL HERO -->
  <div id="editorialHero" class="editorial-placeholder">
    <span>Editorial Image Placeholder</span>
  </div>

  <header class="article-header">
    <h1 id="title">Loading…</h1>
    <div class="article-meta" id="meta"></div>
  </header>

  <section class="article-content" id="content"></section>

  <div class="clear"></div>

  <div class="article-actions">
    <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
    <button id="subscribeBtn">🔔 Subscribe</button>
    <button id="shareBtn">📣 Share</button>
    <button id="copyBtn">🔗 Copy Link</button>
  </div>

</main>

<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (!id) return;

  const res = await fetch("content/articles.json", { cache: "no-store" });
  const data = await res.json();
  const article = data.items.find(a => a.id === id);
  if (!article) return;

  /* ===== TITLE & META ===== */
  document.title = article.title + " | The Mirror Jammu Kashmir";
  document.getElementById("title").textContent = article.title;
  document.getElementById("meta").textContent =
    `${article.location || ""} | ${article.date} • ${article.readTime}`;

  /* ===== HERO PLACEHOLDER ===== */
  const hero = document.getElementById("editorialHero");
  if (article.image) {
    hero.innerHTML = "";
    const img = document.createElement("img");
    img.src = article.image;
    img.alt = article.title;
    img.loading = "lazy";
    img.onload = () => img.classList.add("loaded");
    hero.appendChild(img);
  }

  /* ===== BODY RENDER ===== */
  const content = document.getElementById("content");
  let floatToggle = "right";

  article.body.forEach((block, i) => {

    if (block.type === "paragraph") {
      const p = document.createElement("p");
      p.innerHTML = block.text
        .replace(/collective punishment/gi, "<strong>collective punishment</strong>")
        .replace(/basic rights and dignity/gi, "<strong>basic rights and dignity</strong>");
      content.appendChild(p);
    }

    if (block.type === "image") {
      const wrap = document.createElement("div");
      wrap.className = "img-float img-" + (block.align || floatToggle);

      const img = document.createElement("img");
      img.src = block.src;
      img.alt = block.alt || "";
      img.loading = "lazy";

      const cap = document.createElement("div");
      cap.className = "img-caption";
      cap.textContent = block.alt || "";

      const credit = document.createElement("div");
      credit.className = "img-credit";
      credit.textContent = "© The Mirror Jammu Kashmir";

      wrap.appendChild(img);
      wrap.appendChild(cap);
      wrap.appendChild(credit);
      content.appendChild(wrap);

      floatToggle = floatToggle === "right" ? "left" : "right";
    }
  });

  /* ===== ACTIONS ===== */
  let likes = 0;
  document.getElementById("likeBtn").onclick = () => {
    likes++;
    document.getElementById("likeCount").textContent = likes;
  };

  document.getElementById("subscribeBtn").onclick = e => {
    e.target.textContent = "Subscribed";
    e.target.disabled = true;
  };

  document.getElementById("shareBtn").onclick = () => {
    if (navigator.share) {
      navigator.share({ title: article.title, url: location.href });
    }
  };

  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(location.href);
    alert("Link copied");
  };

  /* ===== SEO SCHEMA ===== */
  const schema = {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": article.title,
    "datePublished": article.date,
    "author": { "@type": "Organization", "name": article.author },
    "image": article.image,
    "publisher": {
      "@type": "Organization",
      "name": "The Mirror Jammu Kashmir"
    }
  };

  const script = document.createElement("script");
  script.type = "application/ld+json";
  script.textContent = JSON.stringify(schema);
  document.head.appendChild(script);

})();
</script>

</body>
</html>
