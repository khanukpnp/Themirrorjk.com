<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="page-title">THE MIRROR JAMMU KASHMIR</title>

<link rel="stylesheet" href="styles.css?v=25">

<style>
/* ============================
   ARTICLE PAGE LAYOUT
============================ */

.article-container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 30px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    display: flex;
    gap: 30px;
}

.article-body {
    width: 72%;
}

.sidebar {
    width: 28%;
    border-left: 1px solid #eee;
    padding-left: 25px;
}

/* ============================
   HERO IMAGE
============================ */

#heroWrap {
    margin-bottom: 25px;
}

#heroImg {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 4px;
}

#heroCaption {
    font-size: 0.9rem;
    color: #666;
    margin-top: 6px;
}

/* ============================
   HEADLINE + STANDFIRST
============================ */

#title {
    font-size: 2rem;
    font-weight: 700;
    margin: 20px 0 10px 0;
}

.standfirst {
    font-size: 1.25rem;
    color: #555;
    margin: 20px 0;
    line-height: 1.6;
}

/* ============================
   META LINE
============================ */

#meta {
    font-size: 0.95rem;
    color: #444;
    margin-bottom: 25px;
    line-height: 1.5;
}

/* ============================
   BODY CONTENT
============================ */

#content p {
    font-size: 1.05rem;
    line-height: 1.7;
    margin-bottom: 18px;
}

/* Inline images */
.img-left {
    float: left;
    width: 45%;
    margin: 10px 20px 20px 0;
}

.img-right {
    float: right;
    width: 45%;
    margin: 10px 0 20px 20px;
}

figure img {
    width: 100%;
    border-radius: 4px;
}

figure figcaption {
    font-size: 0.85rem;
    color: #666;
    margin-top: 4px;
}

/* ============================
   IMPORTANT POINTS
============================ */

.important-points {
    background: #f7f7f7;
    padding: 15px 20px;
    border-left: 4px solid #c00;
    margin: 25px 0;
}

.important-points ul {
    margin: 0;
    padding-left: 20px;
}

.pull-quote {
    background: #f7f7f7;
    border-left: 4px solid #c00;
    padding: 20px;
    margin: 30px 0;
    font-size: 1.2rem;
    font-weight: 600;
    color: #333;
}

/* ============================
   CATEGORY LABEL COLORS
============================ */

.cat-breaking { color: #c00; }
.cat-blog { color: #005bbb; }
.cat-editorial { color: #b8860b; }
.cat-historical { color: #555; }
.cat-humanrights { color: #800000; }
.cat-international { color: #0a7d32; }
.cat-latest { color: #6a0dad; }
.cat-jk { color: #0b7c7c; }
.cat-vlog { color: #d35400; }
.cat-default { color: #900; }

/* ============================
   SIDEBAR
============================ */

.sidebar h3 {
    font-size: 1.2rem;
    margin-bottom: 12px;
}

.sidebar .related-item {
    margin-bottom: 18px;
}

.sidebar .related-item a {
    font-weight: 600;
    color: #900;
    text-decoration: none;
}

.sidebar .related-item p {
    font-size: 0.9rem;
    color: #555;
}

/* Clear floats */
.clearfix::after {
    content: "";
    display: block;
    clear: both;
}
</style>

</head>

<body class="article-page theme-maroon">

<!-- ============================
     ARTICLE CONTAINER
============================ -->

<div class="article-container">

    <!-- MAIN ARTICLE BODY -->
    <div class="article-body">

        <!-- CATEGORY LABEL -->
        <div id="section-label" class="category-label"></div>

        <!-- HERO IMAGE -->
        <div id="heroWrap">
            <img id="heroImg" src="" alt="">
            <div id="heroCaption"></div>
        </div>

        <!-- HEADLINE -->
        <h1 id="title"></h1>

        <!-- META -->
        <div id="meta"></div>

        <!-- CONTENT -->
        <div id="content" class="clearfix"></div>

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h3>Related Articles</h3>
        <div id="related-articles"></div>

        <h3>Latest Updates</h3>
        <div id="latest-updates"></div>

        <h3>Share</h3>
        <p>
            <button onclick="navigator.share({ title: document.title, url: location.href })">
                Share this article
            </button>
        </p>
    </aside>

</div>

<script src="script.js?v=25"></script>

</body>
</html>
