<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read verified reporting from The Mirror Jammu Kashmir." />

  <style>
    .article-page {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: inherit;
    }

    /* ===== BREADCRUMBS ===== */
    .breadcrumbs {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }
    .breadcrumbs a {
      color: inherit;
      text-decoration: none;
    }

    /* ===== EDITORIAL PLACEHOLDER ===== */
    .editorial-placeholder {
      max-height: 220px;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 16px;
      background: #eee;
    }
    .editorial-placeholder img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }
    .editorial-caption {
      font-size: 13px;
      color: #555;
      padding: 6px 10px;
      background: #fafafa;
    }

    /* ===== HEADER ===== */
    .article-header h1 {
      font-size: 32px;
      line-height: 1.25;
      margin: 12px 0 8px;
    }
    .article-meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }

    /* ===== BODY ===== */
    .article-content {
      font-size: 17px;
      line-height: 1.7;
      color: #111;
    }
    .article-content p {
      margin-bottom: 16px;
    }
    .article-content strong {
      font-weight: 600;
    }

    /* ===== IMAGES ===== */
    .img-full {
      margin: 22px 0;
    }
    .img-full img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }

    .img-float {
      width: 35%;
      margin: 6px 0 10px;
    }
    .img-right {
      float: right;
      margin-left: 16px;
    }
    .img-left {
      float: left;
      margin-right: 16px;
    }
    .img-float img {
      width: 100%;
      border-radius: 6px;
      display: block;
    }
    .img-caption {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }
    .img-credit {
      font-size: 12px;
      color: #777;
    }
    .clear {
      clear: both;
    }

    /* ===== FADE IN ===== */
    .fade {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .fade.visible {
      opacity: 1;
      transform: none;
    }

    /* ===== PAGINATION ===== */
    .article-pagination {
      display: flex;
      justify-content: space-between;
      margin: 40px 0 20px;
      font-size: 14px;
    }
    .article-pagination a {
      text-decoration: none;
      color: #333;
    }

    /* ===== ACTIONS ===== */
    .article-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }
    .article-actions button {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .img-float {
        float: none;
        width: 100%;
        margin: 16px 0;
      }
      .editorial-placeholder img {
        height: 180px;
      }
    }
  </style>
</head>

<body>

<main class="article-page">

  <div id="editorialHero" class="editorial-placeholder fade" hidden></div>

  <nav class="breadcrumbs" id="breadcrumbs"></nav>

  <header class="article-header fade">
    <h1 id="title">Loading…</h1>
    <div class="article-meta" id="meta"></div>
  </header>

  <section class="article-content" id="content"></section>

  <nav class="article-pagination" id="pagination"></nav>

  <div class="article-actions fade">
    <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
    <button id="subscribeBtn">🔔 Subscribe</button>
    <button id="shareBtn">📣 Share</button>
    <button id="copyBtn">🔗 Copy Link</button>
  </div>

</main>

<script>
(async function () {

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  if (!id) return;

  const res = await fetch("content/articles.json", { cache: "no-store" });
  const data = await res.json();
  const items = data.items || [];
  const index = items.findIndex(a => a.id === id);
  const article = items[index];
  if (!article) return;

  document.title = article.title + " | The Mirror Jammu Kashmir";
  document.getElementById("title").textContent = article.title;

  document.getElementById("meta").textContent =
    (article.location || "") + " | " + article.date + " • " + article.readTime;

  /* ===== BREADCRUMBS ===== */
  document.getElementById("breadcrumbs").innerHTML =
    `<a href="/">Home</a> › <a href="/blog.html">Blog</a> › ${article.category || ""}`;

  /* ===== EDITORIAL PLACEHOLDER ===== */
  if (article.image) {
    const hero = document.getElementById("editorialHero");
    hero.hidden = false;
    hero.innerHTML =
      `<img src="${article.image}" alt="${article.title}" loading="lazy">
       <div class="editorial-caption">Image credit: The Mirror Jammu Kashmir</div>`;
  }

  /* ===== BODY RENDER ===== */
  const content = document.getElementById("content");
  let floatToggle = true;

  article.body.forEach(block => {
    if (block.type === "paragraph") {
      const p = document.createElement("p");
      p.className = "fade";
      p.innerHTML = block.text
        .replace("complete shutter down", "<strong>complete shutter down</strong>")
        .replace("collective punishment", "<strong>collective punishment</strong>");
      content.appendChild(p);
    }

    if (block.type === "image") {
      const wrap = document.createElement("div");
      const cls = block.align === "right" ? "img-right" : "img-left";
      wrap.className = `img-float ${cls} fade`;

      wrap.innerHTML =
        `<img src="${block.src}" loading="lazy" alt="">
         <div class="img-caption">${block.alt || ""}</div>
         <div class="img-credit">Image credit: The Mirror Jammu Kashmir</div>`;

      content.appendChild(wrap);
      floatToggle = !floatToggle;
    }
  });

  content.appendChild(Object.assign(document.createElement("div"), { className: "clear" }));

  /* ===== PAGINATION ===== */
  const pag = document.getElementById("pagination");
  if (items[index - 1]) {
    pag.innerHTML += `<a href="article.html?id=${items[index - 1].id}">← Previous</a>`;
  }
  if (items[index + 1]) {
    pag.innerHTML += `<a href="article.html?id=${items[index + 1].id}">Next →</a>`;
  }

  /* ===== ACTIONS ===== */
  let likes = 0;
  likeBtn.onclick = () => likeCount.textContent = ++likes;
  subscribeBtn.onclick = e => { e.target.textContent = "Subscribed"; e.target.disabled = true; };
  shareBtn.onclick = () => navigator.share ? navigator.share({ title: article.title, url: location.href }) : null;
  copyBtn.onclick = () => navigator.clipboard.writeText(location.href);

  /* ===== FADE-IN ===== */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => e.isIntersecting && e.target.classList.add("visible"));
  }, { threshold: .15 });

  document.querySelectorAll(".fade").forEach(el => io.observe(el));

  /* ===== SEO SCHEMA ===== */
  const schema = {
    "@context": "https://schema.org",
    "@type": "NewsArticle",
    "headline": article.title,
    "datePublished": article.date,
    "author": { "@type": "Organization", "name": article.author },
    "image": article.image
  };
  const s = document.createElement("script");
  s.type = "application/ld+json";
  s.textContent = JSON.stringify(schema);
  document.head.appendChild(s);

})();
</script>

</body>
</html>
