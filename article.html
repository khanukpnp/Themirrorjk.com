<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>Article | The Mirror Jammu Kashmir</title>

<style>
.article-page {
  max-width: 820px;
  margin: 40px auto;
  padding: 0 16px;
  font-family: inherit;
}

.article-header h1 {
  font-size: 34px;
  line-height: 1.25;
  margin-bottom: 10px;
}

.article-meta {
  font-size: 14px;
  color: #555;
  margin-bottom: 26px;
}

.hero-placeholder {
  background: #f2f2f2;
  border-radius: 10px;
  margin: 32px 0;
  overflow: hidden;
  text-align: center;
}

.hero-placeholder img {
  width: 100%;
  display: block;
}

.hero-placeholder .placeholder-text {
  padding: 60px 20px;
  color: #999;
  font-size: 18px;
}

.article-content {
  font-size: 17px;
  line-height: 1.7;
  color: #111;
}

.article-content p {
  margin-bottom: 18px;
}

.inline-img {
  width: 35%;
  margin: 6px 0 16px 16px;
  float: right;
  border-radius: 6px;
}

.inline-img.left {
  float: left;
  margin: 6px 16px 16px 0;
}

@media (max-width: 700px) {
  .inline-img,
  .inline-img.left {
    float: none;
    width: 100%;
    margin: 18px 0;
  }
}

.article-actions {
  display: flex;
  gap: 12px;
  margin-top: 36px;
  flex-wrap: wrap;
}

.article-actions button {
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid #ccc;
  background: #fff;
  cursor: pointer;
}
</style>
</head>

<body>

<main class="article-page">

<header class="article-header">
  <h1 id="title">Loading…</h1>
  <div class="article-meta" id="meta"></div>
</header>

<!-- HERO IMAGE -->
<div id="hero"></div>

<section class="article-content" id="content"></section>

<div class="article-actions">
  <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
  <button id="subscribeBtn">🔔 Subscribe</button>
  <button id="shareBtn">📣 Share</button>
  <button id="copyBtn">🔗 Copy Link</button>
</div>

</main>

<script>
(async function () {

const params = new URLSearchParams(location.search);
const id = params.get("id");
if (!id) return;

const res = await fetch("content/articles.json", { cache: "no-store" });
const data = await res.json();
const article = data.items.find(a => a.id === id);

if (!article) {
  document.getElementById("title").textContent = "Article not found";
  return;
}

document.title = article.title;
document.getElementById("title").textContent = article.title;
document.getElementById("meta").textContent =
  (article.location || "") + " | " + article.date + " • " + article.readTime;

/* HERO IMAGE (Image 01) */
const hero = document.getElementById("hero");
if (article.image) {
  const wrap = document.createElement("div");
  wrap.className = "hero-placeholder";

  const img = document.createElement("img");
  img.src = article.image;
  img.alt = article.title;

  img.onerror = () => {
    wrap.innerHTML = '<div class="placeholder-text">Editorial Image Placeholder</div>';
  };

  wrap.appendChild(img);
  hero.appendChild(wrap);
}

/* BODY CONTENT */
const content = document.getElementById("content");
let imageIndex = 0;

article.body.forEach(block => {

  if (block.type === "paragraph") {
    const p = document.createElement("p");

    // Emphasize first strong phrase in first two paragraphs
    if (imageIndex < 1 && block.text.length > 80) {
      const parts = block.text.split(". ");
      p.innerHTML = "<strong>" + parts[0] + ".</strong> " + parts.slice(1).join(". ");
    } else {
      p.textContent = block.text;
    }

    content.appendChild(p);
  }

  if (block.type === "image") {
    imageIndex++;

    const img = document.createElement("img");
    img.src = block.src;
    img.alt = block.alt || "";
    img.loading = "lazy";
    img.className = "inline-img";

    if (imageIndex > 1 && imageIndex % 2 === 0) {
      img.classList.add("left");
    }

    content.appendChild(img);
  }
});

/* ACTIONS */
let likes = 0;
likeBtn.onclick = () => {
  likes++;
  likeCount.textContent = likes;
};

subscribeBtn.onclick = e => {
  e.target.textContent = "Subscribed";
  e.target.disabled = true;
};

shareBtn.onclick = () => {
  navigator.share
    ? navigator.share({ title: article.title, url: location.href })
    : navigator.clipboard.writeText(location.href);
};

copyBtn.onclick = () => {
  navigator.clipboard.writeText(location.href);
};

})();
</script>

</body>
</html>
