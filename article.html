<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article | The Mirror Jammu Kashmir</title>

<style>
.article-page{
  max-width:860px;
  margin:32px auto;
  padding:0 16px;
}

/* HERO */
.hero-card{
  height:240px;
  background:#eee;
  border-radius:6px;
  overflow:hidden;
  margin-bottom:10px;
}
.hero-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.hero-caption{
  font-size:13px;
  color:#555;
  margin-bottom:20px;
}
.hero-caption span{
  color:#777;
}

/* HEADER */
.article-header h1{
  font-size:32px;
  line-height:1.25;
  margin:10px 0;
}
.article-meta{
  font-size:14px;
  color:#666;
  margin-bottom:24px;
}

/* BODY */
.article-content{
  font-size:17px;
  line-height:1.75;
  color:#111;
}
.article-content p{
  margin-bottom:18px;
}

/* IMAGES */
.img-float{
  width:35%;
  margin:8px 0 14px;
}
.img-left{float:left;margin-right:18px;}
.img-right{float:right;margin-left:18px;}
.img-float img{
  width:100%;
  border-radius:6px;
}
.figcap{
  font-size:13px;
  color:#555;
  margin-top:4px;
}
.clear{clear:both;}

/* ACTIONS */
.article-actions{
  display:flex;
  gap:12px;
  margin-top:40px;
  flex-wrap:wrap;
}
.article-actions button{
  font-size:14px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid #ccc;
  background:#fff;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .img-float{
    float:none;
    width:100%;
    margin:18px 0;
  }
  .hero-card{height:190px;}
}
</style>
</head>

<body>

<main class="article-page">

<div id="hero" hidden>
  <div class="hero-card" id="heroCard"></div>
  <div class="hero-caption" id="heroCaption"></div>
</div>

<header class="article-header">
  <h1 id="title">Loading…</h1>
  <div id="meta" class="article-meta"></div>
</header>

<section id="content" class="article-content"></section>

<div class="article-actions">
  <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
  <button id="subBtn">🔔 Subscribe</button>
  <button id="shareBtn">📣 Share</button>
  <button id="copyBtn">🔗 Copy Link</button>
</div>

</main>

<script>
(async()=>{

const id=new URLSearchParams(location.search).get("id");
if(!id) return;

const res=await fetch("content/articles.json",{cache:"no-store"});
const data=await res.json();
const a=data.items.find(x=>x.id===id);
if(!a) return;

/* HEADER */
document.title=a.title;
title.textContent=a.title;
meta.textContent=`${a.location||""} · ${a.date} · ${a.readTime}`;

/* HERO */
if(a.heroImage && a.heroImage.src){
  hero.hidden=false;
  heroCard.innerHTML=`<img src="${a.heroImage.src}" alt="">`;
  heroCaption.innerHTML=`${a.heroImage.caption||""} ${a.heroImage.credit? "<span>© "+a.heroImage.credit+"</span>" : ""}`;
}

/* BODY */
a.body.forEach(block=>{

  if(block.type==="paragraph"){
    const p=document.createElement("p");
    p.textContent=block.text;
    content.appendChild(p);
  }

  if(block.type==="image"){
    const div=document.createElement("div");
    div.className=`img-float img-${block.align||"right"}`;
    div.innerHTML=`
      <img src="${block.src}" alt="">
      <div class="figcap">
        ${block.caption||""}
        ${block.credit? "<span> © "+block.credit+"</span>" : ""}
      </div>
    `;
    content.appendChild(div);

    const clr=document.createElement("div");
    clr.className="clear";
    content.appendChild(clr);
  }

});

/* ACTIONS */
let likes=0;
likeBtn.onclick=()=>{likeCount.textContent=++likes;};
subBtn.onclick=()=>{subBtn.textContent="Subscribed";subBtn.disabled=true;};
shareBtn.onclick=()=>navigator.share?navigator.share({title:a.title,url:location.href}):alert("Share not supported");
copyBtn.onclick=()=>{navigator.clipboard.writeText(location.href);alert("Link copied");};

})();
</script>

</body>
</html>
