<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read verified reporting from The Mirror Jammu Kashmir." />

  <style>
    .article-page {
      max-width: 820px;
      margin: 32px auto;
      padding: 0 16px;
      font-family: inherit;
    }
    .article-header h1 {
      font-size: 32px;
      line-height: 1.25;
      margin-bottom: 12px;
    }
    .article-meta {
      font-size: 14px;
      color: #555;
      margin-bottom: 24px;
    }
    .article-content {
      font-size: 17px;
      line-height: 1.7;
      color: #111;
    }
    .article-content p {
      margin-bottom: 16px;
    }
    .article-image {
      margin: 28px 0;
    }
    .article-image img {
      width: 100%;
      border-radius: 6px;
    }
    .article-actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
    }
    .article-actions button {
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>

<body>

<main class="article-page">

  <header class="article-header">
    <h1 id="title">Loading…</h1>
    <div class="article-meta" id="meta"></div>
  </header>

  <section class="article-content" id="content"></section>

  <div class="article-actions">
    <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
    <button id="subscribeBtn">🔔 Subscribe</button>
    <button id="shareBtn">📣 Share</button>
    <button id="copyBtn">🔗 Copy Link</button>
  </div>

</main>

<script>
(async function () {

  const params = new URLSearchParams(location.search);
  const id = params.get("id");

  if (!id) {
    document.getElementById("title").textContent = "Article not found";
    return;
  }

  let res;
  try {
    res = await fetch("content/articles.json", { cache: "no-store" });
  } catch {
    document.getElementById("title").textContent = "Failed to load article";
    return;
  }

  const data = await res.json();
  const article = data.items.find(a => a.id === id);

  if (!article) {
    document.getElementById("title").textContent = "Article not found";
    return;
  }

  document.title = article.title + " | The Mirror Jammu Kashmir";
  document.getElementById("title").textContent = article.title;

  document.getElementById("meta").textContent =
    (article.location || "") +
    " | " + article.date +
    " • " + article.readTime;

  const content = document.getElementById("content");

  article.body.forEach(block => {

    if (block.type === "paragraph") {
      const p = document.createElement("p");
      p.textContent = block.text;
      content.appendChild(p);
    }

    if (block.type === "image") {
      const figure = document.createElement("figure");
      figure.className = "article-image";

      const img = document.createElement("img");
      img.src = block.src;
      img.alt = block.alt || "Article image";
      img.loading = "lazy";

      img.onerror = () => {
        img.replaceWith(document.createTextNode("Image unavailable"));
      };

      figure.appendChild(img);
      content.appendChild(figure);
    }

  });

  // Like
  let likes = 0;
  document.getElementById("likeBtn").onclick = () => {
    likes++;
    document.getElementById("likeCount").textContent = likes;
  };

  // Subscribe
  document.getElementById("subscribeBtn").onclick = e => {
    e.target.textContent = "Subscribed";
    e.target.disabled = true;
  };

  // Share
  document.getElementById("shareBtn").onclick = () => {
    if (navigator.share) {
      navigator.share({ title: article.title, url: location.href });
    } else {
      navigator.clipboard.writeText(location.href);
      alert("Link copied");
    }
  };

  // Copy
  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(location.href);
    alert("Link copied");
  };

})();
</script>

</body>
</html>
