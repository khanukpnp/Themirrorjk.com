<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="doc-title">Article | The Mirror Jammu Kashmir</title>
  <meta name="description" content="Read the latest reporting from The Mirror Jammu Kashmir." />
  <link rel="stylesheet" href="styles.css?v=9" />
</head>

<body class="theme-maroon article-page">

<header class="site-header">
  <div class="header-row">
    <img src="assets/logo.png" class="logo" alt="Logo"
         onerror="this.onerror=null;this.src='logo.png';" />
    <h1 class="site-title">THE MIRROR JAMMU KASHMIR</h1>
    <img src="assets/logo.png" class="logo" alt="Logo"
         onerror="this.onerror=null;this.src='logo.png';" />
  </div>
  <div class="subheading">
    CHAMPION JUSTICE & AMPLIFY THE VOICES OF THE UNHEARD
  </div>
</header>

<main class="article-container">

  <article class="article-shell">

    <header class="article-header">
      <span id="article-category" class="article-category"></span>
      <h1 id="article-title" class="article-title">Loading…</h1>

      <div class="article-meta">
        <span id="article-author"></span>
        <span id="article-date"></span>
        <span id="article-readtime"></span>
      </div>
    </header>

    <figure class="article-figure">
      <img id="article-image" alt="" loading="lazy" />
    </figure>

    <section id="article-content" class="article-content"></section>

    <footer class="page-actions">
      <button class="action-btn" data-like>
        ❤️ Like <span data-like-count>0</span>
      </button>
      <button class="action-btn" data-copy>
        🔗 Copy Link
      </button>
      <button class="action-btn primary" data-share>
        📣 Share
      </button>
    </footer>

  </article>

</main>

<footer class="footer">
  <div class="social">
    <a href="#">𝕏</a>
    <a href="#">📸</a>
    <a href="#">▶️</a>
    <a href="#">📘</a>
  </div>
  <p>© <span id="year"></span> THE MIRROR JAMMU KASHMIR</p>
</footer>

<script src="script.js?v=9"></script>
<script>
  if (window.initArticlePage) window.initArticlePage();
</script>
</body>
</html>
