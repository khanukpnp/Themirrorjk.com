<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Article | The Mirror Jammu Kashmir</title>

<link rel="stylesheet" href="styles.css">
</head>

<body class="theme-maroon">

<header class="site-header">
  <h1 class="site-title">The Mirror Jammu Kashmir</h1>
</header>

<main class="main">
  <section class="article-container">
    <div class="article-shell">

      <div id="heroWrap" style="display:none;">
        <figure class="article-figure">
          <img id="heroImg" src="" alt="">
          <figcaption id="heroCaption"></figcaption>
        </figure>
      </div>

      <header>
        <h1 id="title"></h1>
        <div id="meta"></div>
      </header>

      <div id="content" class="article-content"></div>

      <div class="page-actions">
        <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
        <button id="subBtn">🔔 Subscribe</button>
        <button id="shareBtn">📣 Share</button>
        <button id="copyBtn">🔗 Copy Link</button>
      </div>

    </div>
  </section>
</main>

<script>
(async function(){

const id = new URLSearchParams(location.search).get("id");
if(!id) return;

let data;

try{
  const res = await fetch("content/articles.json",{cache:"no-store"});
  data = await res.json();
}catch(e){
  console.error("JSON failed");
  return;
}

if(!data.items) return;

const a = data.items.find(x => x.id === id);
if(!a) return;

document.getElementById("title").textContent = a.title;
document.getElementById("meta").textContent =
  `${a.location || ""} · ${a.date} · ${a.readTime}`;

if(a.heroImage && a.heroImage.src){
  document.getElementById("heroWrap").style.display="block";
  document.getElementById("heroImg").src = a.heroImage.src;
  document.getElementById("heroCaption").textContent =
    (a.heroImage.caption || "") +
    (a.heroImage.credit ? " © " + a.heroImage.credit : "");
}

a.body.forEach(block => {

    const p = document.createElement("p");
    p.textContent = block.text;
    content.appendChild(p);
  }
