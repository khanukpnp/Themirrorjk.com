[build]
  publish = "/"
  command = ""

# 1️⃣ Route ALL article requests to the Netlify Function
[[redirects]]
  from = "/article"
  to = "/.netlify/functions/article"
  status = 200
  query = { id = ":id" }

[[redirects]]
  from = "/article.html"
  to = "/.netlify/functions/article"
  status = 200
  query = { id = ":id" }

# 2️⃣ Keep your static pages
[[redirects]]
  from = "/blog-001.html"
  to = "/blog-001.html"
  status = 200

[[redirects]]
  from = "/breaking-001.html"
  to = "/breaking-001.html"
  status = 200

# 3️⃣ Catch-all fallback (MUST be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
