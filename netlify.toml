[functions]
  directory = "netlify/functions"

[build]
  publish = "."
  command = ""

# IMPORTANT: Do NOT redirect article.html - let normal users load the actual page

# Social media crawlers use this special path for meta tags
[[redirects]]
  from = "/article-preview"
  to = "/.netlify/functions/article-social"
  status = 200
  force = true
  query = { id = ":id" }

# SPA fallback - keep this LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
