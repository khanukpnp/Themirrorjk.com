[build]
  publish = "/"
  command = ""

# ✅ Redirect article requests to the Netlify Function
[[redirects]]
  from = "/article"
  to = "/.netlify/functions/article"
  status = 200

# ✅ Optional: keep compatibility with old URLs
[[redirects]]
  from = "/article.html"
  to = "/.netlify/functions/article"
  status = 200

# ✅ Other static pages (you can keep these)
[[redirects]]
  from = "/blog-001.html"
  to = "/blog-001.html"
  status = 200

[[redirects]]
  from = "/breaking-001.html"
  to = "/breaking-001.html"
  status = 200

# ✅ Catch‑all fallback for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
