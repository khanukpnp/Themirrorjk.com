[functions]
directory = "content/netlify/functions"

[build]
  publish = "/"
  command = ""

# Handle article.html requests with query parameters
[[redirects]]
  from = "/article.html"
  to = "/.netlify/functions/article"
  status = 200
  force = true
  query = { id = ":id" }

# Handle /article requests with query parameters
[[redirects]]
  from = "/article"
  to = "/.netlify/functions/article"
  status = 200
  force = true
  query = { id = ":id" }

# Handle direct article paths (optional, for cleaner URLs)
[[redirects]]
  from = "/article/*"
  to = "/.netlify/functions/article?id=:splat"
  status = 200
  force = true

# SPA fallback - this handles all other routes by serving index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
