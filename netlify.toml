[functions]
  directory = "netlify/functions"

[build]
  publish = "."
  command = ""

# CRITICAL: Social media crawlers route to function for meta tags
[[redirects]]
  from = "/article.html"
  to = "/.netlify/functions/article-social"
  status = 200
  force = true
  query = { id = ":id" }

# Catch-all for SPA - keep this LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
