[functions]
directory = "content/netlify/functions"

[build]
  publish = "/"
  command = ""

[[redirects]]
  from = "/article.html"
  to = "/.netlify/functions/article"
  status = 200
  force = true
  query = { id = ":id" }

[[redirects]]
  from = "/article"
  to = "/.netlify/functions/article"
  status = 200
  force = true
  query = { id = ":id" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
