[functions]
  directory = "netlify/functions"

[build]
  publish = "."
  command = ""

# IMPORTANT: Article redirects MUST come BEFORE the catch-all rule

# Social media crawlers go to Netlify function for meta tags
[[redirects]]
  from = "/article-social"
  to = "/.netlify/functions/article-social"
  status = 200
  force = true
  query = { id = ":id" }

# SPA fallback - serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
