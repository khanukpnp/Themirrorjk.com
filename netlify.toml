[functions]
  directory = "netlify/functions"

[build]
  publish = "."
  command = ""

# IMPORTANT: Social media redirect MUST come before catch-all

# Route all article.html requests through the function for meta tags
[[redirects]]
  from = "/article.html"
  to = "/.netlify/functions/article-social"
  status = 200
  force = true
  query = { id = ":id" }

# Also handle direct /article requests
[[redirects]]
  from = "/article"
  to = "/.netlify/functions/article-social"
  status = 200
  force = true
  query = { id = ":id" }

# SPA fallback - keep this LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
