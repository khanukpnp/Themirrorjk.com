<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>About | THE MIRROR JAMMU KASHMIR</title>
<link rel="stylesheet" href="styles.css?v=30">
</head>

<body class="article-page theme-maroon">

<main class="page-shell about-page">
<section class="article-container">
<div class="article-shell">

<div class="section-title red-bar">About The Mirror Jammu Kashmir</div>

<header class="article-header">
<h1 id="about-title">Loading…</h1>
<div class="article-meta" id="about-subtitle"></div>
</header>

<!-- CONTENT + IMAGE INLINE -->
<div class="article-content" id="about-content"></div>

<!-- ACTION BUTTONS -->
<div class="page-actions">
<button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
<button id="subBtn">🔔 Subscribe</button>
<button id="shareBtn">📣 Share</button>
<button id="copyBtn">🔗 Copy Link</button>
</div>

</div>
</section>
</main>

<footer class="footer">
<p>© <span id="year"></span> THE MIRROR JAMMU KASHMIR. All rights reserved.</p>
</footer>

<script>
// YEAR
document.getElementById("year").textContent = new Date().getFullYear();

// LIKE
let likes = 0;
document.getElementById("likeBtn").onclick =
() => document.getElementById("likeCount").textContent = ++likes;

// SUBSCRIBE
document.getElementById("subBtn").onclick = function(){
this.textContent="Subscribed";
this.disabled=true;
};

// SHARE
document.getElementById("shareBtn").onclick = () =>
navigator.share
? navigator.share({title:document.title,url:location.href})
: alert("Share not supported");

// COPY LINK
document.getElementById("copyBtn").onclick =
() => navigator.clipboard.writeText(location.href);

// LOAD ABOUT.JSON
async function loadAbout() {
try {
const res = await fetch("content/about.json", { cache: "no-store" });
const data = await res.json();

// TITLE + SUBTITLE
document.getElementById("about-title").textContent = data.title;
document.getElementById("about-subtitle").textContent = data.subtitle;

// CONTENT CONTAINER
const container = document.getElementById("about-content");
container.innerHTML = "";

// INSERT FLOATING IMAGE FIRST INSIDE CONTENT
if (data.heroImage?.src) {
container.innerHTML += `
<figure class="float-right" style="width:${data.heroImage.width || '38%'}">
  <img src="${data.heroImage.src}" alt="${data.heroImage.caption}">
  <figcaption>${data.heroImage.caption}</figcaption>
</figure>
`;
}

// INSERT BODY CONTENT
data.body.forEach(block => {
if (block.type === "paragraph") {
container.innerHTML += `<p>${block.text}</p>`;
}
if (block.type === "header") {
container.innerHTML += `<h2 style="margin-top:40px;">${block.text}</h2>`;
}
if (block.type === "points") {
const items = block.items.map(i => `<li>${i}</li>`).join("");
container.innerHTML += `
<div class="important-points">
<ul>${items}</ul>
</div>`;
}
});

} catch (err) {
console.error("Failed to load about.json", err);
document.getElementById("about-title").textContent = "Error loading content";
}
}

loadAbout();
</script>

</body>
</html>
