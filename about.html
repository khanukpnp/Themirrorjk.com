<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="./">
  <title>About | THE MIRROR JAMMU KASHMIR</title>
  <link rel="stylesheet" href="styles.css?v=6">
</head>

<body class="article-page theme-maroon">

<main class="main">

  <section class="article-container">
    <div class="article-shell">

      <!-- HEADER -->
      <header class="article-header">
        <h1 id="title"></h1>
        <div id="meta" class="article-meta"></div>
      </header>

      <!-- HERO IMAGE (Logo) -->
      <div id="heroWrap" style="display:block;">
        <figure class="article-figure" style="float:right;width:33%;margin:0 0 20px 25px;">
          <img id="heroImg" src="assets/logo.png" alt="The Mirror Jammu Kashmir Logo" style="width:100%;height:auto;">
          <figcaption id="heroCaption"></figcaption>
        </figure>
      </div>

      <!-- CONTENT LOADED FROM JSON -->
      <div id="content" class="article-content"></div>

      <!-- ACTION BUTTONS -->
      <div class="page-actions">
        <button id="likeBtn">❤️ Like <span id="likeCount">0</span></button>
        <button id="subBtn">🔔 Subscribe</button>
        <button id="shareBtn">📣 Share</button>
        <button id="copyBtn">🔗 Copy Link</button>
      </div>

    </div>
  </section>

</main>

<footer class="footer">
  <p>© <span id="year"></span> THE MIRROR JAMMU KASHMIR. All rights reserved.</p>
</footer>

<script src="script.js?v=6"></script>

</body>
</html>
