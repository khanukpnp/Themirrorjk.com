<!-- WINDOW 1 LATEST -->
<article class="card post">
  <div class="media">
    <span class="badge cat">Top Stories</span>
    <span class="badge time" id="latest-time">—</span>
    <img id="latest-image" src="assets/placeholder.svg" alt="Latest">
  </div>
  <div class="card-body">
    <h3 id="latest-title">Loading...</h3>
    <p id="latest-excerpt"></p>
    <div class="meta">
      <span id="latest-author"></span>
      <span id="latest-date"></span>
    </div>
    <a id="latest-link" class="read-more">Read More →</a>
  </div>
</article>
