<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Mirror Jammu Kashmir</title>

    <!-- Basic Reset -->
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; }
        header { background: #111; color: #fff; padding: 20px; text-align: center; }
        h2.section-title { margin: 40px 0 10px; padding-left: 20px; font-size: 24px; }

        /* Loading Screen */
        #loading-screen {
            position: fixed; inset: 0; background: #000;
            color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        #loading-bar {
            width: 200px; height: 6px; background: #333; margin-top: 20px;
            border-radius: 3px; overflow: hidden;
        }
        #loading-bar-progress {
            width: 0%; height: 100%; background: #e60000; transition: width 0.4s;
        }

        /* Vlog 3-window layout */
        #vlog-grid {
            display: flex; gap: 20px; padding: 20px;
        }
        .vlog-card {
            background: #fff; border-radius: 6px; overflow: hidden;
            flex: 1; cursor: pointer; display: flex; flex-direction: column;
        }
        .vlog-thumb { width: 100%; height: 180px; object-fit: cover; }
        .vlog-card-body { padding: 15px; }
        .vlog-title { margin: 0 0 10px; font-size: 18px; }
        .vlog-meta span { margin-right: 10px; color: #777; font-size: 14px; }
        .vlog-actions { margin-top: 10px; }
        .btn-play { padding: 8px 14px; background: #e60000; color: #fff; border: none; cursor: pointer; }

        /* Archive cards */
        .archive-card {
            background: #fff; border-radius: 6px; overflow: hidden;
            cursor: pointer; display: flex; flex-direction: column;
        }
        .archive-thumb { width: 100%; height: 180px; object-fit: cover; }
        .archive-card-body { padding: 15px; }
        .archive-title { margin: 0 0 10px; font-size: 18px; }
        .archive-meta span { margin-right: 10px; color: #777; font-size: 14px; }

        /* Archive grid */
        .archive-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; padding: 20px;
        }

        /* Pagination */
        .pagination { text-align: center; margin: 20px 0; }
        .pagination button {
            margin: 0 5px; padding: 8px 14px; border: none;
            background: #ddd; cursor: pointer;
        }
        .pagination .is-active { background: #e60000; color: #fff; }

        /* Inline images */
        .inline-image-left { float: left; width: 40%; margin: 10px 20px 10px 0; }
        .inline-image-right { float: right; width: 40%; margin: 10px 0 10px 20px; }
        .inline-image-caption { font-size: 13px; color: #666; }

        /* Important points */
        .important-points { background: #fff; padding: 20px; margin: 20px 0; border-left: 4px solid #e60000; }
        .important-points-title { margin-top: 0; }
        .important-points-list { padding-left: 20px; }

        /* Clear floats */
        .clear { clear: both; }
    </style>
</head>

<body>

<!-- Loading Screen -->
<div id="loading-screen">
    <h1>THE MIRROR JAMMU KASHMIR</h1>
    <p>Loading newsroom...</p>
    <div id="loading-bar"><div id="loading-bar-progress"></div></div>
</div>

<header>
    <h1>The Mirror Jammu Kashmir</h1>
</header>

<!-- VLOG SECTION -->
<h2 class="section-title">Vlog</h2>
<div id="vlog-grid"></div>
<div style="padding-left:20px;">
    <button id="vlog-visit-channel" class="btn-play">Visit Channel</button>
</div>

<!-- ARCHIVE SECTION (Homepage block) -->
<h2 class="section-title">Archive</h2>
<p style="padding-left:20px; color:#555;">Explore older reports, articles, and videos.</p>
<div style="padding-left:20px;">
    <a href="latest-archive.html">Visit Archive →</a>
</div>

<!-- FOOTER -->
<footer style="text-align:center; padding:40px; color:#777;">
    © The Mirror Jammu Kashmir
</footer>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>
    // Fake loading animation
    window.addEventListener("load", () => {
        const bar = document.getElementById("loading-bar-progress");
        bar.style.width = "100%";
        setTimeout(() => {
            document.getElementById("loading-screen").style.display = "none";
        }, 600);
    });
</script>

</body>
</html>
