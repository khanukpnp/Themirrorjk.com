<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mirror Jammu Kashmir – Content</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/theme-maroon.css">
</head>

<body class="article-page theme-maroon">

    <!-- HEADER -->
    <header id="site-header"></header>

    <!-- MAIN WRAPPER -->
    <main class="article-wrapper">

        <!-- LEFT SIDEBAR -->
        <aside class="sidebar-left" id="sidebar-left"></aside>

        <!-- ARTICLE CONTENT -->
        <article class="article-container">

            <!-- HERO IMAGE -->
            <div class="article-hero">
                <img id="hero-image" src="" alt="">
                <div class="hero-caption">
                    <span id="hero-caption-text"></span>
                    <span id="hero-credit"></span>
                </div>
            </div>

            <!-- TITLE -->
            <h1 id="title" class="article-title"></h1>

            <!-- META -->
            <div id="meta" class="article-meta"></div>

            <!-- BODY CONTENT -->
            <div id="content" class="article-content"></div>

            <!-- ACTION BAR -->
            <div class="article-actions">
                <button id="btn-like" class="action-btn">
                    <span class="icon">👍</span>
                    <span>Like</span>
                </button>

                <button id="btn-subscribe" class="action-btn">
                    <span class="icon">🔔</span>
                    <span>Subscribe</span>
                </button>

                <button id="btn-share" class="action-btn">
                    <span class="icon">📤</span>
                    <span>Share</span>
                </button>

                <button id="btn-copy" class="action-btn">
                    <span class="icon">🔗</span>
                    <span>Copy Link</span>
                </button>
            </div>

        </article>

        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar-right" id="sidebar-right"></aside>

    </main>

    <!-- FOOTER -->
    <footer id="site-footer"></footer>

    <!-- SCRIPTS -->
    <script src="assets/js/script.js"></script>

</body>
</html>
